<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        html, body { overflow-x: hidden; max-width: 100vw; margin: 0; padding: 0; background: #eef2f6; color: #1f2937; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; }
        
        .nav-tabs { display: flex; gap: 12px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 14px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; text-align: center; }
        .tab-btn.active { background: #1e3a8a; color: #fff; box-shadow: 0 4px 12px rgba(30,58,138,0.25); }
        
        .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; width: 100%; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .header-bar h2 { margin: 0; font-size: 19px; color: #0f172a; }
        
        .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; width: 100%; }
        .field { display: flex; flex-direction: column; flex: 1; min-width: 160px; position: relative; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #475569; }
        input, textarea { padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; background: #fff; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .btn { padding: 11px 20px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-back { background: #475569; color: #fff; }
        .btn-export { background: #059669; color: #fff; }
        .btn-scan { background: #7c3aed; color: #fff; }
        .btn-setting { background: #334155; color: #fff; }
        .btn-del { background: #ef4444; color: #fff; padding: 6px 10px; font-size: 13px; height: 32px; border-radius: 6px; }
        
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; width: 100%; }
        .order-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 18px; cursor: pointer; position: relative; }
        .order-item:hover { border-color: #2563eb; background: #eff6ff; }
        .order-item h3 { margin: 0 0 6px 0; font-size: 18px; color: #1e3a8a; }
        .order-meta { font-size: 13px; color: #475569; line-height: 1.6; }
        .order-del-top { position: absolute; top: 14px; right: 14px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-weight: bold; font-size: 12px; }

        .autocomplete-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.12); max-height: 220px; overflow-y: auto; z-index: 99; margin-top: 4px; }
        .autocomplete-item { padding: 11px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
        .autocomplete-item:hover { background: #eff6ff; color: #1d4ed8; }

        .table-wrap { padding: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table.align-table { width: 100%; min-width: 480px; border-collapse: collapse; table-layout: fixed; }
        .align-table th, .align-table td { padding: 13px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 15px; word-break: break-word; }
        .th-color { background: #f1f5f9; color: #0f172a; font-size: 15px; border-right: 2px solid #cbd5e1; text-align: left; padding-left: 12px !important; }
        .th-nesting { background: #dbeafe; color: #1e40af; font-size: 15px; border-right: 2px solid #94a3b8; }
        .th-saw { background: #fef3c7; color: #92400e; font-size: 15px; border-right: 2px solid #94a3b8; }
        .th-action { background: #f1f5f9; color: #334155; font-size: 13px; }
        .divider { border-right: 2px solid #94a3b8 !important; }
        .cell-color { background: #ffffff; text-align: left !important; padding-left: 12px !important; border-right: 2px solid #cbd5e1 !important; }
        .cell-n { background: #f8fafc; color: #1e40af; }
        .cell-s { background: #fffdf7; color: #b45309; }
        .merged-text { font-weight: bold; color: #111827; font-size: 15px; }
        .merged-sub { font-weight: normal; color: #4b5563; margin-left: 5px; font-size: 13px; }
        .qty-bold { font-weight: bold; font-size: 18px; }
        .qty-empty { color: #cbd5e1; font-size: 15px; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; font-size: 15px; }

        table.catalog-table { width: 100%; border-collapse: collapse; }
        .catalog-table th, .catalog-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        .catalog-table th { background: #f8fafc; color: #334155; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-card { background: #fff; width: 100%; max-width: 460px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .modal-header h3 { margin: 0; color: #1e3a8a; font-size: 18px; }
        .modal-close { background: none; border: none; font-size: 22px; font-weight: bold; cursor: pointer; color: #64748b; }
        .modal-body { display: flex; flex-direction: column; gap: 14px; }

        @media (max-width: 768px) {
            .container { padding: 12px; }
            .card { padding: 16px; }
            .tab-btn { padding: 12px 10px; font-size: 14px; }
            .align-table th, .align-table td { padding: 10px 6px; font-size: 13px; }
            .th-color, .cell-color { padding-left: 8px !important; }
            .merged-text { font-size: 13px; }
            .merged-sub { display: block; margin-left: 0; font-size: 12px; }
            .qty-bold { font-size: 15px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-tabs">
        <button id="tabOrdersBtn" class="tab-btn active" onclick="switchPage('orders')">📋 訂單分板作業</button>
        <button id="tabCatalogBtn" class="tab-btn" onclick="switchPage('catalog')">🎨 色號對照表</button>
    </div>
    
    <div id="pageOrders">
        <div id="viewOrders">
            <div class="card">
                <div class="header-bar">
                    <h2>訂單管理</h2>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button onclick="openOrderModal()" class="btn btn-primary">➕ 新建訂單</button>
                        <button onclick="openMachineModal()" class="btn btn-setting">⚙️ 機台與欄寬</button>
                        <button onclick="exportAllCSV()" class="btn btn-export">匯出全部總表</button>
                    </div>
                </div>
                <p style="color:#64748b; font-size:14px; margin:0;">
                    目前機台：<strong id="machineSummaryText" style="color:#1e3a8a;">Nesting ／ 電子鋸</strong>（欄寬：<span id="widthSummaryText">30% / 28% / 28% / 14%</span>）。
                </p>
            </div>
            <div class="card">
                <div class="header-bar"><h2>已建立的訂單列表</h2></div>
                <div id="orderListGrid" class="order-grid"></div>
            </div>
        </div>
        
        <div id="viewDetail" style="display: none;">
            <div class="card">
                <div class="header-bar">
                    <div>
                        <button onclick="goBack()" class="btn btn-back" style="height: 38px; padding: 6px 14px; font-size: 14px;">返回列表</button>
                        <span id="currentOrderTitle" style="font-size: 15px; font-weight: bold; margin-left: 10px; color: #1e3a8a;"></span>
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button onclick="openItemModal()" class="btn btn-primary" style="height: 38px; padding: 6px 14px; font-size: 14px;">➕ 加入色號</button>
                        <button onclick="openMachineModal()" class="btn btn-setting" style="height: 38px; padding: 6px 14px; font-size: 14px;">⚙️ 機台與欄寬</button>
                        <button onclick="exportSingleCSV()" class="btn btn-export" style="height: 38px; padding: 6px 14px; font-size: 14px;">匯出此單 Excel</button>
                    </div>
                </div>
            </div>

            <div class="card table-wrap">
                <table class="align-table">
                    <thead>
                        <tr>
                            <th id="thColor" class="th-color" style="width: 30%;">色號 / 木名</th>
                            <th id="thMachine1" class="th-nesting" style="width: 28%;">Nesting 數量</th>
                            <th id="thMachine2" class="th-saw" style="width: 28%;">電子鋸 數量</th>
                            <th id="thAction" class="th-action" style="width: 14%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="detailTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="pageCatalog" style="display: none;">
        <div class="card">
            <div class="header-bar"><h2>新增 / 修改 色號對照</h2></div>
            <form id="catalogForm" class="row">
                <div class="field" style="max-width: 200px;"><label>色號 *</label><input type="text" id="catCode" placeholder="例: H3303" required autocomplete="off"></div>
                <div class="field" style="max-width: 300px;"><label>木名 *</label><input type="text" id="catName" placeholder="例: 漢密爾頓橡木" required autocomplete="off"></div>
                <button type="submit" class="btn btn-primary">儲存對照</button>
            </form>
        </div>
        <div class="card">
            <div class="header-bar"><h2>📥 批次匯入對照表</h2></div>
            <p style="font-size:13px; color:#475569; margin-top:0;">每行一筆，用 <strong>Tab</strong>、<strong>空格</strong> 或 <strong>逗號</strong> 分隔。</p>
            <textarea id="batchInput" rows="4" style="width:100%;" placeholder="H3303 漢密爾頓橡木&#10;701 雪白"></textarea>
            <div style="margin-top: 12px; display:flex; justify-content:space-between; gap: 10px; flex-wrap: wrap;">
                <button type="button" onclick="batchImportCatalog()" class="btn btn-export">⚡ 執行批次匯入</button>
                <button type="button" onclick="clearCatalog()" class="btn btn-del" style="height: 46px; font-size: 14px;">清空全部</button>
            </div>
        </div>
        <div class="card">
            <div class="header-bar"><h2>已建檔色號（<span id="catalogCount">0</span> 筆）</h2><input type="text" id="searchCatalog" placeholder="搜尋色號或木名..." style="width: 220px; padding: 9px 12px;" autocomplete="off"></div>
            <div style="overflow-x: auto;">
                <table class="catalog-table">
                    <thead><tr><th>色號</th><th>木名</th><th style="width: 130px;">操作</th></tr></thead>
                    <tbody id="catalogTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 彈窗 A：建立訂單 Modal -->
<div id="orderModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>建立新訂單</h3>
            <button class="modal-close" onclick="closeOrderModal()">&times;</button>
        </div>
        <form id="orderModalForm" class="modal-body">
            <div class="field">
                <label>新訂單號 *</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="modalOrderId" placeholder="輸入或掃描 QR 碼" required autocomplete="off" style="flex: 1;">
                    <button type="button" onclick="openScanner()" class="btn btn-scan" style="height: 44px; padding: 0 14px; font-size: 14px; white-space: nowrap;">📷 掃描</button>
                </div>
            </div>
            <div class="field"><label>案名</label><input type="text" id="modalProjectName" placeholder="例: 王先生案" autocomplete="off"></div>
            <div class="field"><label>出貨日期</label><input type="date" id="modalShipDate"></div>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">確認建立並進入</button>
        </form>
    </div>
</div>

<!-- 彈窗 B：加入色號 Modal -->
<div id="itemModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>加入板材色號</h3>
            <button class="modal-close" onclick="closeItemModal()">&times;</button>
        </div>
        <form id="itemModalForm" class="modal-body">
            <div class="field">
                <label>板材色號 *</label>
                <input type="text" id="modalColorCode" placeholder="輸入色號或木名關鍵字..." autocomplete="off" required>
                <div id="modalDropdown" class="autocomplete-dropdown"></div>
            </div>
            <div class="field"><label>木名 *</label><input type="text" id="modalWoodName" placeholder="自動帶出" required autocomplete="off"></div>
            <div class="row" style="gap: 10px;">
                <div class="field"><label id="labelMachine1" style="color:#1e40af;">Nesting 數</label><input type="number" id="modalNestingQty" min="0" placeholder="留空"></div>
                <div class="field"><label id="labelMachine2" style="color:#b45309;">電子鋸 數</label><input type="number" id="modalSawQty" min="0" placeholder="留空"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">確認加入色號</button>
        </form>
    </div>
</div>

<!-- 彈窗 C：機台名稱與欄寬微調 Modal -->
<div id="machineModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>微調機台名稱與欄寬</h3>
            <button class="modal-close" onclick="closeMachineModal()">&times;</button>
        </div>
        <form id="machineModalForm" class="modal-body">
            <div class="row" style="gap: 10px;">
                <div class="field">
                    <label style="color:#1e40af;">左側機台名稱 *</label>
                    <input type="text" id="inputMachine1" required autocomplete="off">
                </div>
                <div class="field">
                    <label style="color:#1e40af;">左機台欄寬 (%) *</label>
                    <input type="number" id="inputWidthM1" min="10" max="60" required>
                </div>
            </div>
            <div class="row" style="gap: 10px;">
                <div class="field">
                    <label style="color:#b45309;">右側機台名稱 *</label>
                    <input type="text" id="inputMachine2" required autocomplete="off">
                </div>
                <div class="field">
                    <label style="color:#b45309;">右機台欄寬 (%) *</label>
                    <input type="number" id="inputWidthM2" min="10" max="60" required>
                </div>
            </div>
            <div class="row" style="gap: 10px;">
                <div class="field">
                    <label>色號/木名欄寬 (%) *</label>
                    <input type="number" id="inputWidthColor" min="15" max="60" required>
                </div>
                <div class="field">
                    <label>操作欄寬 (%) *</label>
                    <input type="number" id="inputWidthAction" min="8" max="30" required>
                </div>
            </div>
            <div style="display:flex; gap:10px; margin-top: 10px;">
                <button type="button" onclick="resetMachineSettings()" class="btn btn-back" style="flex:1;">恢復預設</button>
                <button type="submit" class="btn btn-primary" style="flex:2;">儲存設定</button>
            </div>
        </form>
    </div>
</div>

<!-- 相機掃描 QR 彈窗 -->
<div id="scannerModal" class="modal-overlay" style="z-index: 1100;">
    <div class="modal-card" style="text-align: center;">
        <div class="modal-header">
            <h3>對準訂單 QR Code</h3>
            <button class="modal-close" onclick="closeScanner()">&times;</button>
        </div>
        <video id="videoElement" autoplay playsinline style="width: 100%; height: 240px; object-fit: cover; border-radius: 8px; background: #000;"></video>
        <canvas id="canvasElement" style="display:none;"></canvas>
        <p id="scanStatus" style="font-size: 13px; color: #64748b; margin: 10px 0;">正在尋找 QR Code...</p>
        <button type="button" onclick="closeScanner()" class="btn btn-back" style="width: 100%;">關閉相機</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
    const DEFAULT_SETTINGS = {
        m1: 'Nesting',
        m2: '電子鋸',
        wColor: 30,
        wM1: 28,
        wM2: 28,
        wAction: 14
    };
    let ordersDB = JSON.parse(localStorage.getItem('ordersMasterDBV13')) || {};
    let colorCatalog = JSON.parse(localStorage.getItem('colorCatalogDB')) || {};
    let machineSettings = JSON.parse(localStorage.getItem('machineSettingsDB')) || { ...DEFAULT_SETTINGS };
    let currentOrder = null;
    let videoStream = null;
    let scanningActive = false;

    applyMachineSettings();
    renderOrderList();

    function applyMachineSettings() {
        const m1 = machineSettings.m1 || DEFAULT_SETTINGS.m1;
        const m2 = machineSettings.m2 || DEFAULT_SETTINGS.m2;
        const wColor = Number(machineSettings.wColor) || DEFAULT_SETTINGS.wColor;
        const wM1 = Number(machineSettings.wM1) || DEFAULT_SETTINGS.wM1;
        const wM2 = Number(machineSettings.wM2) || DEFAULT_SETTINGS.wM2;
        const wAction = Number(machineSettings.wAction) || DEFAULT_SETTINGS.wAction;

        document.getElementById('machineSummaryText').textContent = `${m1} ／ ${m2}`;
        document.getElementById('widthSummaryText').textContent = `${wColor}% / ${wM1}% / ${wM2}% / ${wAction}%`;
        document.getElementById('thMachine1').textContent = `${m1} 數量`;
        document.getElementById('thMachine2').textContent = `${m2} 數量`;
        document.getElementById('labelMachine1').textContent = `${m1} 數`;
        document.getElementById('labelMachine2').textContent = `${m2} 數`;

        document.getElementById('thColor').style.width = `${wColor}%`;
        document.getElementById('thMachine1').style.width = `${wM1}%`;
        document.getElementById('thMachine2').style.width = `${wM2}%`;
        document.getElementById('thAction').style.width = `${wAction}%`;
    }

    function openMachineModal() {
        document.getElementById('inputMachine1').value = machineSettings.m1 || DEFAULT_SETTINGS.m1;
        document.getElementById('inputMachine2').value = machineSettings.m2 || DEFAULT_SETTINGS.m2;
        document.getElementById('inputWidthColor').value = machineSettings.wColor ?? DEFAULT_SETTINGS.wColor;
        document.getElementById('inputWidthM1').value = machineSettings.wM1 ?? DEFAULT_SETTINGS.wM1;
        document.getElementById('inputWidthM2').value = machineSettings.wM2 ?? DEFAULT_SETTINGS.wM2;
        document.getElementById('inputWidthAction').value = machineSettings.wAction ?? DEFAULT_SETTINGS.wAction;
        document.getElementById('machineModal').style.display = 'flex';
        setTimeout(() => document.getElementById('inputWidthM1').focus(), 100);
    }

    function closeMachineModal() {
        document.getElementById('machineModal').style.display = 'none';
    }

    function resetMachineSettings() {
        document.getElementById('inputMachine1').value = DEFAULT_SETTINGS.m1;
        document.getElementById('inputMachine2').value = DEFAULT_SETTINGS.m2;
        document.getElementById('inputWidthColor').value = DEFAULT_SETTINGS.wColor;
        document.getElementById('inputWidthM1').value = DEFAULT_SETTINGS.wM1;
        document.getElementById('inputWidthM2').value = DEFAULT_SETTINGS.wM2;
        document.getElementById('inputWidthAction').value = DEFAULT_SETTINGS.wAction;
    }

    document.getElementById('machineModalForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const m1 = document.getElementById('inputMachine1').value.trim();
        const m2 = document.getElementById('inputMachine2').value.trim();
        const wColor = Number(document.getElementById('inputWidthColor').value);
        const wM1 = Number(document.getElementById('inputWidthM1').value);
        const wM2 = Number(document.getElementById('inputWidthM2').value);
        const wAction = Number(document.getElementById('inputWidthAction').value);
        if (!m1 || !m2 || [wColor, wM1, wM2, wAction].some(n => Number.isNaN(n) || n <= 0)) return;

        machineSettings = { m1, m2, wColor, wM1, wM2, wAction };
        localStorage.setItem('machineSettingsDB', JSON.stringify(machineSettings));
        applyMachineSettings();
        closeMachineModal();
        renderOrderList();
        if (currentOrder) renderDetailTable();
    });

    function switchPage(page) {
        document.getElementById('pageOrders').style.display = page === 'orders' ? 'block' : 'none';
        document.getElementById('pageCatalog').style.display = page === 'catalog' ? 'block' : 'none';
        document.getElementById('tabOrdersBtn').classList.toggle('active', page ===
