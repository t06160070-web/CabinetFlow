<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>按鈕測試版</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; padding: 30px; background: #eef2f6; }
        .box { max-width: 800px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; }
        button { padding: 10px 18px; font-size: 16px; margin-right: 10px; cursor: pointer; }
        #msg { margin-top: 20px; padding: 12px; background: #f1f5f9; border-radius: 8px; }
    </style>
</head>
<body>
<div class="box">
    <h2>按鍵測試頁</h2>
    <button type="button" id="b1">測試按鈕 1</button>
    <button type="button" id="b2">測試按鈕 2</button>
    <div id="msg">還沒按任何按鈕</div>
</div>

<script>
    const msg = document.getElementById('msg');
    document.getElementById('b1').onclick = function () {
        msg.textContent = '按鈕 1 有反應了！時間：' + new Date().toLocaleTimeString();
    };
    document.getElementById('b2').onclick = function () {
        msg.textContent = '按鈕 2 有反應了！時間：' + new Date().toLocaleTimeString();
    };
</script>
</body>
</html>
