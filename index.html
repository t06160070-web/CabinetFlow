<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { margin: 0; padding: 20px 16px; background: #eef2f6; color: #1f2937; }
        .wrap { width: 100%; max-width: 1050px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 18px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; background: #2563eb; }
        .btn-gray { background: #475569; }
        .btn-green { background: #059669; }
        .btn-purple { background: #7c3aed; }
        .btn-amber { background: #d97706; padding: 6px 10px; font-size: 13px; }
        .btn-red { background: #ef4444; padding: 6px 10px; font-size: 13px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
        .tab { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; }
        .tab.active { background: #1e3a8a; color: #fff; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
        .order-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 16px; cursor: pointer; position: relative; }
        .order-box:hover { border-color: #2563eb; background: #eff6ff; }
        .order-del-btn { position: absolute; top: 12px; right: 12px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 9px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .order-del-btn:hover { background: #fecaca; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 11px 8px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 15px; vertical-align: middle; }
        th.col-color, td.col-color { text-align: left; padding-left: 12px; }
        th.th-m1 { background: #dbeafe; color: #1e40af; }
        th.th-m2 { background: #fef3c7; color: #92400e; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; }
        .row-acts { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

        .code-line { display: block; font-size: 14px; font-weight: bold; color: #111827; line-height: 1.3; }
        .wood-subline { display: block; font-size: 11.5px; font-weight: normal; color: #64748b; line-height: 1.35; margin-top: 2px; }

        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; padding: 16px; z-index: 999; }
        .modal-card { background: #fff; width: 100%; max-width: 440px; padding: 20px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; flex: 1; position: relative; }
        label { font-size: 13px; font-weight: bold; color: #475569; }
        input, textarea { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; background: #fff; }
        .row2 { display: flex; gap: 10px; }

        .type-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 30; box-shadow: 0 6px 14px rgba(0,0,0,0.12); }
        .type-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; font-size: 14px; }
        .type-item:hover { background: #eff6ff; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="tabs">
        <button type="button" id="tabOrders" class="tab active" onclick="switchTab('orders')">📋 訂單分板</button>
        <button type="button" id="tabCatalog" class="tab" onclick="switchTab('catalog')">🎨 色號對照表</button>
    </div>

    <!-- 訂單分頁 -->
    <div id="secOrders">
        <div id="listView">
            <div class="card top-bar">
                <h2 style="margin:0;">訂單分板管理</h2>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button type="button" class="btn" onclick="openOrderModal()">➕ 新建訂單</button>
                    <button type="button" class="btn btn-gray" onclick="openWidthModal()">⚙️ 機台欄寬</button>
                    <button type="button" class="btn btn-green" onclick="exportAll()">匯出全部 CSV</button>
                </div>
            </div>
            <div class="card">
                <div id="orderList" class="order-grid"></div>
            </div>
        </div>

        <div id="detailView" style="display:none;">
            <div class="card top-bar">
                <div style="display:flex; align-items:center; flex-wrap:wrap; gap:8px;">
                    <button type="button" class="btn btn-gray" onclick="backToList()">← 返回</button>
                    <strong id="detailTitle" style="font-size:16px; color:#1e3a8a;"></strong>
                    <button type="button" class="btn btn-amber" onclick="openEditOrderModal()">✏️ 修改單據</button>
                </div>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button type="button" class="btn" onclick="openItemModal()">➕ 加入色號</button>
                    <button type="button" class="btn btn-gray" onclick="openWidthModal()">⚙️ 機台欄寬</button>
                    <button type="button" class="btn btn-green" onclick="exportOne()">匯出此單 CSV</button>
                </div>
            </div>
            <div class="card" style="padding:0; overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th id="thColor" class="col-color" style="width:32%;">色號 / 木名</th>
                            <th id="thM1" class="th-m1" style="width:27%;">Nesting 數量</th>
                            <th id="thM2" class="th-m2" style="width:27%;">電子鋸 數量</th>
                            <th id="thAct" style="width:14%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="detailBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 色號對照表分頁 -->
    <div id="secCatalog" style="display:none;">
        <div class="card">
            <div class="top-bar" style="margin-bottom:12px;">
                <h3 style="margin:0;">新增 / 修改 色號對照</h3>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button type="button" class="btn btn-green" onclick="openCatalogListModal()">➕ 新建清單</button>
                    <button type="button" class="btn btn-gray" onclick="exportCatalog()">匯出對照 CSV</button>
                </div>
            </div>
            <div class="row2" style="flex-wrap:wrap;">
                <div class="field"><label>色號 *</label><input type="text" id="catCode" autocomplete="off" placeholder="例: H3303"></div>
                <div class="field"><label>木名 *</label><input type="text" id="catWood" autocomplete="off" placeholder="例: 漢密爾頓橡木"></div>
                <div style="display:flex; align-items:flex-end; margin-bottom:12px;">
                    <button type="button" class="btn" onclick="saveCatalogItem()">儲存</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="top-bar" style="margin-bottom:12px;">
                <h3 style="margin:0;">已建檔色號（<span id="catCount">0</span>）</h3>
                <input type="text" id="catSearch" autocomplete="off" oninput="renderCatalog()" placeholder="搜尋色號或木名..." style="max-width:220px;">
            </div>
            <table>
                <thead><tr><th class="col-color" style="width:30%;">色號</th><th class="col-color" style="width:52%;">木名</th><th style="width:18%;">操作</th></tr></thead>
                <tbody id="catBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 彈窗1：新建訂單 -->
<div id="orderModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">建立新訂單</h3>
        <div class="field">
            <label>訂單號 *</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="inOrderId" autocomplete="off" placeholder="輸入或掃描單號">
                <button type="button" class="btn btn-purple" style="white-space:nowrap;" onclick="openCamModal()">📷 掃描</button>
            </div>
        </div>
        <div class="field"><label>案名</label><input type="text" id="inProject" autocomplete="off"></div>
        <div class="field"><label>出貨日期</label><input type="date" id="inDate" autocomplete="off"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" class="btn btn-gray" onclick="closeOrderModal()">取消</button>
            <button type="button" class="btn" onclick="submitOrder()">確定建立</button>
        </div>
    </div>
</div>

<!-- 彈窗2：加入 / 修改 色號 -->
<div id="itemModal" class="modal-bg">
    <div class="modal-card">
        <h3 id="itemModalTitle" style="margin-top:0;">加入板材色號</h3>
        <div class="field">
            <label>色號 *</label>
            <input type="text" id="inCode" autocomplete="off" oninput="onTypeColor()" placeholder="打字搜尋預設 / 已建檔色號...">
            <div id="typeColorList" class="type-list"></div>
        </div>
        <div class="field">
            <label>木名 *</label>
            <input type="text" id="inWood" autocomplete="off" placeholder="例: 漢密爾頓橡木">
        </div>
        <div class="row2">
            <div class="field"><label>Nesting 數</label><input type="number" id="inN" min="0" autocomplete="off"></div>
            <div class="field"><label>電子鋸 數</label><input type="number" id="inS" min="0" autocomplete="off"></div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" class="btn btn-gray" onclick="closeItemModal()">取消</button>
            <button type="button" class="btn" onclick="submitItem()">確認儲存</button>
        </div>
    </div>
</div>

<!-- 彈窗3：機台欄寬微調 -->
<div id="widthModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">微調機台欄寬 (%)</h3>
        <div class="row2">
            <div class="field"><label>色號/木名 (%)</label><input type="number" id="wColor" min="15" max="60" autocomplete="off"></div>
            <div class="field"><label>操作欄 (%)</label><input type="number" id="wAct" min="8" max="30" autocomplete="off"></div>
        </div>
        <div class="row2">
            <div class="field"><label>Nesting (%)</label><input type="number" id="wM1" min="10" max="60" autocomplete="off"></div>
            <div class="field"><label>電子鋸 (%)</label><input type="number" id="wM2" min="10" max="60" autocomplete="off"></div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" class="btn btn-gray" onclick="closeWidthModal()">取消</button>
            <button type="button" class="btn" onclick="submitWidths()">套用</button>
        </div>
    </div>
</div>

<!-- 彈窗4：相機掃描 -->
<div id="camModal" class="modal-bg" style="z-index:1100;">
    <div class="modal-card" style="text-align:center;">
        <h3 style="margin-top:0;">掃描訂單 QR Code</h3>
        <video id="camVideo" autoplay playsinline style="width:100%; height:220px; background:#000; border-radius:8px; object-fit:cover;"></video>
        <canvas id="camCanvas" style="display:none;"></canvas>
        <p id="camStatus" style="font-size:13px; color:#64748b;">準備開啟鏡頭...</p>
        <button type="button" class="btn btn-gray" style="width:100%;" onclick="closeCamModal()">關閉相機</button>
    </div>
</div>

<!-- 彈窗5：新建清單（批次匯入對照） -->
<div id="catalogListModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">新建色號清單</h3>
        <div class="field">
            <label>每行一筆（可用空白、逗號或 Tab 分隔）</label>
            <textarea id="modalCatList" rows="6" placeholder="H3303 漢密爾頓橡木&#10;701 雪白"></textarea>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" class="btn btn-gray" onclick="closeCatalogListModal()">取消</button>
            <button type="button" class="btn btn-green" onclick="submitCatalogListModal()">⚡ 匯入對照</button>
        </div>
    </div>
</div>

<!-- 彈窗6：修改單據案名與出貨日期 -->
<div id="editOrderModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">修改訂單資訊</h3>
        <div class="field"><label>訂單號</label><input type="text" id="editOrderId" disabled style="background:#f1f5f9;"></div>
        <div class="field"><label>案名</label><input type="text" id="editProject" autocomplete="off"></div>
        <div class="field"><label>出貨日期</label><input type="date" id="editDate" autocomplete="off"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" class="btn btn-gray" onclick="closeEditOrderModal()">取消</button>
            <button type="button" class="btn" onclick="submitEditOrder()">儲存修改</button>
        </div>
    </div>
</div>

<script>
    const DEFAULT_CATALOG = {
        'H3303': '漢密爾頓橡木',
        '701': '雪白',
        'U999': '炭黑',
        'H1145': '巴登白橡',
        'W1000': '尊貴白'
    };

    let db = JSON.parse(localStorage.getItem('boardSystemDB_v2') || 'null') || {};
    let catalog = JSON.parse(localStorage.getItem('boardSystemCatalog_v2') || 'null');
    if (!catalog || Object.keys(catalog).length === 0) {
        catalog = Object.assign({}, DEFAULT_CATALOG);
    }
    let widths = JSON.parse(localStorage.getItem('boardSystemWidths_v2') || 'null') || { color: 32, m1: 27, m2: 27, act: 14 };
    let curId = null;
    let editItemIdx = null;

    applyWidths();
    renderOrders();

    function saveAll() {
        localStorage.setItem('boardSystemDB_v2', JSON.stringify(db));
        localStorage.setItem('boardSystemCatalog_v2', JSON.stringify(catalog));
        localStorage.setItem('boardSystemWidths_v2', JSON.stringify(widths));
    }

    function switchTab(tab) {
        document.getElementById('secOrders').style.display = tab === 'orders' ? 'block' : 'none';
        document.getElementById('secCatalog').style.display = tab === 'catalog' ? 'block' : 'none';
        document.getElementById('tabOrders').classList.toggle('active', tab === 'orders');
        document.getElementById('tabCatalog').classList.toggle('active', tab === 'catalog');
        if (tab === 'catalog') renderCatalog();
        if (tab === 'orders' && !curId) renderOrders();
    }

    function applyWidths() {
        document.getElementById('thColor').style.width = widths.color + '%';
        document.getElementById('thM1').style.width = widths.m1 + '%';
        document.getElementById('thM2').style.width = widths.m2 + '%';
        document.getElementById('thAct').style.width = widths.act + '%';
    }

    function openOrderModal() {
        document.getElementById('orderModal').style.display = 'flex';
        document.getElementById('inOrderId').focus();
    }

    function closeOrderModal() {
        closeCamModal();
        document.getElementById('orderModal').style.display = 'none';
        document.getElementById('inOrderId').value = '';
        document.getElementById('inProject').value = '';
        document.getElementById('inDate').value = '';
    }

    function submitOrder() {
        const id = document.getElementById('inOrderId').value.trim();
        if (!id) return alert('請輸入訂單號');
        if (!db[id]) {
            db[id] = {
                project: document.getElementById('inProject').value.trim(),
                date: document.getElementById('inDate').value,
                items: []
            };
        } else {
            db[id].project = document.getElementById('inProject').value.trim();
            db[id].date = document.getElementById('inDate').value;
        }
        saveAll();
        closeOrderModal();
        openDetail(id);
    }

    function openEditOrderModal() {
        if (!curId || !db[curId]) return;
        document.getElementById('editOrderId').value = curId;
        document.getElementById('editProject').value = db[curId].project || '';
        document.getElementById('editDate').value = db[curId].date || '';
        document.getElementById('editOrderModal').style.display = 'flex';
        document.getElementById('editProject').focus();
    }

    function closeEditOrderModal() {
        document.getElementById('editOrderModal').style.display = 'none';
    }

    function submitEditOrder() {
        if (!curId || !db[curId]) return;
        db[curId].project = document.getElementById('editProject').value.trim();
        db[curId].date = document.getElementById('editDate').value;
        saveAll();
        document.getElementById('detailTitle').textContent = `[${curId}] ${db[curId].project || '未命名'}｜出貨日期：${db[curId].date || '未定'}`;
        closeEditOrderModal();
    }

    function openItemModal() {
        editItemIdx = null;
        document.getElementById('itemModalTitle').textContent = '加入板材色號';
        document.getElementById('inCode').value = '';
        document.getElementById('inWood').value = '';
        document.getElementById('inN').value = '';
        document.getElementById('inS').value = '';
        document.getElementById('typeColorList').style.display = 'none';
        document.getElementById('itemModal').style.display = 'flex';
        document.getElementById('inCode').focus();
    }

    function openEditItemModal(idx) {
        const it = db[curId] && db[curId].items && db[curId].items[idx];
        if (!it) return;
        editItemIdx = idx;
        document.getElementById('itemModalTitle').textContent = '修改板材色號與數量';
        document.getElementById('inCode').value = it.code;
        document.getElementById('inWood').value = it.wood;
        document.getElementById('inN').value = it.n || '';
        document.getElementById('inS').value = it.s || '';
        document.getElementById('typeColorList').style.display = 'none';
        document.getElementById('itemModal').style.display = 'flex';
        document.getElementById('inN').focus();
    }

    function closeItemModal() {
        editItemIdx = null;
        document.getElementById('itemModal').style.display = 'none';
        document.getElementById('typeColorList').style.display = 'none';
        document.getElementById('inCode').value = '';
        document.getElementById('inWood').value = '';
        document.getElementById('inN').value = '';
        document.getElementById('inS').value = '';
    }

    function onTypeColor() {
        const kw = document.getElementById('inCode').value.trim().toLowerCase();
        const box = document.getElementById('typeColorList');
        if (!kw) {
            box.style.display = 'none';
            return;
        }
        const matches = Object.entries(catalog).filter(([c, w]) =>
            c.toLowerCase().includes(kw) || w.toLowerCase().includes(kw)
        );
        if (!matches.length) {
            box.style.display = 'none';
            return;
        }
        box.innerHTML = matches.map(([c, w]) =>
            `<div class="type-item" onclick="pickTypeColor('${c.replace(/'/g, "\\'")}', '${w.replace(/'/g, "\\'")}')"><strong>${c}</strong><span style="color:#64748b;">${w}</span></div>`
        ).join('');
        box.style.display = 'block';
    }

    function pickTypeColor(c, w) {
        document.getElementById('inCode').value = c;
        document.getElementById('inWood').value = w;
        document.getElementById('typeColorList').style.display = 'none';
        document.getElementById('inN').focus();
    }

    function submitItem() {
        if (!curId) return;
        const code = document.getElementById('inCode').value.trim();
        const wood = document.getElementById('inWood').value.trim();
        const n = Number(document.getElementById('inN').value) || 0;
        const s = Number(document.getElementById('inS').value) || 0;
        if (!code || !wood || (n === 0 && s === 0)) return alert('請填色號、木名與至少一邊數量');
        catalog[code] = wood;
        const rowData = { code, wood, n, s };
        if (editItemIdx !== null && db[curId].items[editItemIdx]) {
            db[curId].items[editItemIdx] = rowData;
        } else {
            db[curId].items.push(rowData);
        }
        saveAll();
        renderDetail();
        closeItemModal();
    }

    function openWidthModal() {
        document.getElementById('wColor').value = widths.color;
        document.getElementById('wM1').value = widths.m1;
        document.getElementById('wM2').value = widths.m2;
        document.getElementById('wAct').value = widths.act;
        document.getElementById('widthModal').style.display = 'flex';
    }

    function closeWidthModal() {
        document.getElementById('widthModal').style.display = 'none';
    }

    function submitWidths() {
        widths = {
            color: Number(document.getElementById('wColor').value) || 32,
            m1: Number(document.getElementById('wM1').value) || 27,
            m2: Number(document.getElementById('wM2').value) || 27,
            act: Number(document.getElementById('wAct').value) || 14
        };
        applyWidths();
        saveAll();
        closeWidthModal();
    }

    function openCatalogListModal() {
        document.getElementById('catalogListModal').style.display = 'flex';
        document.getElementById('modalCatList').focus();
    }

    function closeCatalogListModal() {
        document.getElementById('catalogListModal').style.display = 'none';
        document.getElementById('modalCatList').value = '';
    }

    function submitCatalogListModal() {
        const lines = document.getElementById('modalCatList').value.trim().split(/\r?\n/);
        let n = 0;
        lines.forEach(line => {
            const m = line.trim().match(/^([^\t,，\s]+)[\t,，\s]+(.+)$/);
            if (m) { catalog[m[1].trim()] = m[2].trim(); n++; }
        });
        if (!n) return alert('沒有可匯入的資料');
        saveAll();
        closeCatalogListModal();
        renderCatalog();
        alert(`已匯入 ${n} 筆`);
    }

    function openDetail(id) {
        curId = id;
        const o = db[id] || {};
        document.getElementById('listView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        document.getElementById('detailTitle').textContent = `[${id}] ${o.project || '未命名'}｜出貨日期：${o.date || '未定'}`;
        renderDetail();
    }

    function backToList() {
        curId = null;
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('listView').style.display = 'block';
        renderOrders();
    }

    function delOrder(e, id) {
        e.stopPropagation();
        if (!confirm(`確定要刪除訂單「${id}」嗎？`)) return;
        delete db[id];
        saveAll();
        if (curId === id) backToList();
        else renderOrders();
    }

    function delItem(idx) {
        db[curId].items.splice(idx, 1);
        saveAll();
        renderDetail();
    }

    function renderOrders() {
        const keys = Object.keys(db).reverse();
        document.getElementById('orderList').innerHTML = keys.length ? keys.map(id => {
            const o = db[id];
            const nSum = (o.items || []).reduce((a, b) => a + b.n, 0);
            const sSum = (o.items || []).reduce((a, b) => a + b.s, 0);
            const safeId = id.replace(/'/g, "\\'");
            return `<div class="order-box" onclick="openDetail('${safeId}')">
                <button type="button" class="order-del-btn" onclick="delOrder(event, '${safeId}')">刪除</button>
                <h3 style="margin:0 0 6px 0; color:#1e3a8a; padding-right:42px;">${id}</h3>
                <div style="font-size:13px; color:#475569;">案名：${o.project || '未填'}｜出貨日期：${o.date || '未定'}<br>Nesting：<strong>${nSum}</strong>｜電子鋸：<strong>${sSum}</strong></div>
            </div>`;
        }).join('') : '<div style="color:#64748b;">尚無訂單，點上方「➕ 新建訂單」開始。</div>';
    }

    function renderDetail() {
        const items = (db[curId] && db[curId].items) || [];
        let nSum = 0, sSum = 0;
        document.getElementById('detailBody').innerHTML = items.map((it, i) => {
            nSum += it.n; sSum += it.s;
            return `<tr>
                <td class="col-color"><span class="code-line">${it.code}</span><span class="wood-subline">${it.wood}</span></td>
                <td><strong>${it.n || '-'}</strong></td>
                <td><strong>${it.s || '-'}</strong></td>
                <td>
                    <div class="row-acts">
                        <button type="button" class="btn btn-amber" onclick="openEditItemModal(${i})">修改</button>
                        <button type="button" class="btn btn-red" onclick="delItem(${i})">刪除</button>
                    </div>
                </td>
            </tr>`;
        }).join('') + `<tr class="sum-row"><td class="col-color">合計</td><td>${nSum} 片</td><td>${sSum} 片</td><td></td></tr>`;
    }

    function saveCatalogItem() {
        const c = document.getElementById('catCode').value.trim();
        const w = document.getElementById('catWood').value.trim();
        if (!c || !w) return alert('請填寫色號與木名');
        catalog[c] = w;
        saveAll();
        document.getElementById('catCode').value = '';
        document.getElementById('catWood').value = '';
        renderCatalog();
    }

    function delCatalog(c) {
        delete catalog[c];
        saveAll();
        renderCatalog();
    }

    function renderCatalog() {
        const kw = document.getElementById('catSearch').value.trim().toLowerCase();
        const entries = Object.entries(catalog).filter(([c, w]) => c.toLowerCase().includes(kw) || w.toLowerCase().includes(kw));
        document.getElementById('catCount').textContent = Object.keys(catalog).length;
        document.getElementById('catBody').innerHTML = entries.length ? entries.map(([c, w]) => `
            <tr>
                <td class="col-color"><strong>${c}</strong></td>
                <td class="col-color">${w}</td>
                <td><button type="button" class="btn btn-red" onclick="delCatalog('${c.replace(/'/g, "\\'")}')">刪除</button></td>
            </tr>
        `).join('') : '<tr><td colspan="3" style="color:#94a3b8;">尚無色號對照</td></tr>';
    }

    function dl(csv, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = name;
        a.click();
    }

    function exportCatalog() {
        const entries = Object.entries(catalog);
        if (!entries.length) return alert('無色號對照資料');
        let csv = '\uFEFF色號,木名\n';
        entries.forEach(([c, w]) => csv += `"${c}","${w}"\n`);
        dl(csv, '色號對照表.csv');
    }

    function exportOne() {
        const o = db[curId];
        if (!o || !o.items.length) return alert('無資料');
        let csv = '\uFEFF訂單號,案名,出貨日期,色號,木名,Nesting數量,電子鋸數量\n';
        o.items.forEach(i => csv += `"${curId}","${o.project || ''}","${o.date || ''}","${i.code}","${i.wood}",${i.n || ''},${i.s || ''}\n`);
        dl(csv, `訂單_${curId}.csv`);
    }

    function exportAll() {
        const keys = Object.keys(db);
        if (!keys.length) return alert('無資料');
        let csv = '\uFEFF訂單號,案名,出貨日期,色號,木名,Nesting數量,電子鋸數量\n';
        keys.forEach(id => {
            const o = db[id];
            (o.items || []).forEach(i => csv += `"${id}","${o.project || ''}","${o.date || ''}","${i.code}","${i.wood}",${i.n || ''},${i.s || ''}\n`);
        });
        dl(csv, '全部訂單總表.csv');
    }
</script>

<!-- 獨立相機掃描模組 -->
<script>
    let camStream = null;
    let camActive = false;

    (function loadJsQR() {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
        document.body.appendChild(s);
    })();

    function openCamModal() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            return alert('目前瀏覽器或環境不支援相機掃描');
        }
        document.getElementById('camModal').style.display = 'flex';
        document.getElementById('camStatus').textContent = '啟動鏡頭中...';
        camActive = true;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => {
                camStream = stream;
                const video = document.getElementById('camVideo');
                video.srcObject = stream;
                video.play();
                document.getElementById('camStatus').textContent = '請對準 QR Code';
                requestAnimationFrame(scanFrame);
            })
            .catch(() => {
                alert('無法開啟相機，請檢查權限設定');
                closeCamModal();
            });
    }

    function scanFrame() {
        if (!camActive) return;
        const video = document.getElementById('camVideo');
        if (video.readyState === video.HAVE_ENOUGH_DATA && typeof window.jsQR === 'function') {
            const canvas = document.getElementById('camCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
            if (code && code.data && code.data.trim()) {
                document.getElementById('inOrderId').value = code.data.trim();
                closeCamModal();
                return;
            }
        }
        if (camActive) requestAnimationFrame(scanFrame);
    }

    function closeCamModal() {
        camActive = false;
        if (camStream) {
            camStream.getTracks().forEach(t => t.stop());
            camStream = null;
        }
        const video = document.getElementById('camVideo');
        if (video) video.srcObject = null;
        document.getElementById('camModal').style.display = 'none';
    }
</script>
</body>
