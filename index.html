<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>系統櫃訂單分板系統 (優化版)</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { background: #eef2f6; padding: 20px; margin: 0; color: #1f2937; }
        .container { max-width: 1050px; margin: 0 auto; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; }
        .tab-btn.active { background: #1e3a8a; color: #fff; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f3f4f6; padding-bottom: 12px; margin-bottom: 16px; }
        .header-bar h2 { margin: 0; font-size: 19px; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .field { display: flex; flex-direction: column; flex: 1; min-width: 140px; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #4b5563; }
        input, textarea { padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; }
        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: #2563eb; color: #fff; font-size: 15px; }
        .btn-back { background: #4b5563; color: #fff; }
        .btn-export { background: #059669; color: #fff; }
        .btn-del { background: #ef4444; color: #fff; padding: 5px 10px; font-size: 13px; }
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .order-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; cursor: pointer; position: relative; }
        .order-item:hover { border-color: #2563eb; background: #eff6ff; }
        .order-item h3 { margin: 0 0 8px 0; font-size: 18px; color: #1e3a8a; }
        .order-meta { font-size: 13px; color: #475569; line-height: 1.6; }
        .order-del-top { position: absolute; top: 12px; right: 12px; background: #fee2e2; color: #dc2626; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-weight: bold; }
        table.align-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .align-table th, .align-table td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #e5e7eb; font-size: 15px; }
        .th-nesting { background: #dbeafe; color: #1e40af; font-size: 16px; border-right: 2px solid #94a3b8; }
        .th-saw { background: #fef3c7; color: #92400e; font-size: 16px; }
        .sub-nesting { background: #eff6ff; color: #1e3a8a; font-size: 13px; }
        .sub-saw { background: #fffbeb; color: #78350f; font-size: 13px; }
        .divider { border-right: 2px solid #94a3b8 !important; }
        .cell-n { background: #f8fafc; }
        .cell-s { background: #fffdf7; }
        .merged-text { font-weight: bold; color: #111827; font-size: 15px; }
        .merged-sub { font-weight: normal; color: #4b5563; margin-left: 6px; }
        .qty-bold { font-weight: bold; font-size: 18px; color: #0f172a; }
        .sum-row td { background: #f3f4f6; font-weight: bold; border-top: 2px solid #cbd5e1; }
        table.catalog-table { width: 100%; border-collapse: collapse; }
        .catalog-table th, .catalog-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 15px; }
        .catalog-table th { background: #f8fafc; color: #334155; }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-tabs">
        <button id="tabOrdersBtn" class="tab-btn active" onclick="switchPage('orders')">📋 訂單分板作業</button>
        <button id="tabCatalogBtn" class="tab-btn" onclick="switchPage('catalog')">🎨 色號與木名對照表管理</button>
    </div>
    <div id="pageOrders">
        <div id="viewOrders">
            <div class="card">
                <div class="header-bar"><h2>步驟 1：建立或選擇訂單號</h2><button onclick="exportAllCSV()" class="btn btn-export">匯出全部訂單 Excel</button></div>
                <form id="createOrderForm" class="row">
                    <div class="field" style="max-width: 320px;"><label>新訂單號 *</label><input type="text" id="newOrderId" placeholder="輸入訂單號 (例: ORD-202601)" required autocomplete="off"></div>
                    <button type="submit" class="btn btn-primary">建立並進入訂單</button>
                </form>
            </div>
            <div class="card">
                <div class="header-bar"><h2>已建立的訂單列表（點擊卡片進入分板）</h2></div>
                <div id="orderListGrid" class="order-grid"></div>
            </div>
        </div>
        <div id="viewDetail" style="display: none;">
            <div class="card">
                <div class="header-bar">
                    <div><button onclick="goBack()" class="btn btn-back">返回訂單列表</button><span id="currentOrderTitle" style="font-size: 20px; font-weight: bold; margin-left: 12px; color: #1e3a8a;"></span></div>
                    <button onclick="exportSingleCSV()" class="btn btn-export">匯出此單 Excel</button>
                </div>
                <form id="addColorForm" class="row">
                    <div class="field"><label>板材色號 *</label><input type="text" id="colorCode" list="colorHistoryList" placeholder="輸入或選擇色號" autocomplete="off" required><datalist id="colorHistoryList"></datalist></div>
                    <div class="field"><label>木名 *</label><input type="text" id="woodName" placeholder="自動帶出或手動輸入" required autocomplete="off"></div>
                    <div class="field" style="max-width: 145px;"><label style="color:#1e40af;">Nesting 數量</label><input type="number" id="nestingQty" min="0" placeholder="無則留空"></div>
                    <div class="field" style="max-width: 145px;"><label style="color:#b45309;">電子鋸 數量</label><input type="number" id="sawQty" min="0" placeholder="無則留空"></div>
                    <button type="submit" class="btn btn-primary">加入此色號</button>
                </form>
            </div>
            <div class="card" style="padding: 0; overflow: hidden;">
                <table class="align-table">
                    <thead>
                        <tr><th colspan="2" class="th-nesting">Nesting</th><th colspan="2" class="th-saw">電子鋸</th><th rowspan="2" style="width: 70px; background:#f3f4f6; font-size:13px;">操作</th></tr>
                        <tr><th class="sub-nesting" style="width: 32%;">色號 / 木名</th><th class="sub-nesting divider" style="width: 14%;">數量</th><th class="sub-saw" style="width: 32%;">色號 / 木名</th><th class="sub-saw" style="width: 14%;">數量</th></tr>
                    </thead>
                    <tbody id="detailTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="pageCatalog" style="display: none;">
        <div class="card">
            <div class="header-bar"><h2>新增 / 修改 單筆色號</h2></div>
            <form id="catalogForm" class="row">
                <div class="field" style="max-width: 220px;"><label>板材色號 *</label><input type="text" id="catCode" placeholder="例: H3303" required autocomplete="off"></div>
                <div class="field" style="max-width: 300px;"><label>對應木名 *</label><input type="text" id="catName" placeholder="例: 漢密爾頓橡木" required autocomplete="off"></div>
                <button type="submit" class="btn btn-primary">儲存至對照表</button>
            </form>
        </div>
        <div class="card">
            <div class="header-bar"><h2>📥 批次匯入色號對照表（支援直接從 Excel 複製貼上）</h2></div>
            <p style="font-size:13px; color:#4b5563; margin-top:0;">格式：<strong>一行一筆</strong>，色號與木名之間用 <strong>Tab（複製 Excel 兩欄）</strong>、<strong>空格</strong> 或 <strong>逗號</strong> 分隔即可。</p>
            <textarea id="batchInput" rows="5" style="width:100%;" placeholder="貼上範例：&#10;H3303	漢密爾頓橡木&#10;701	雪白"></textarea>
            <div style="margin-top: 10px; display:flex; justify-content:space-between;">
                <button type="button" onclick="batchImportCatalog()" class="btn btn-export">⚡ 執行批次匯入</button>
                <button type="button" onclick="clearCatalog()" class="btn btn-del">清空全部色號庫</button>
            </div>
        </div>
        <div class="card">
            <div class="header-bar"><h2>已建檔色號清單（共 <span id="catalogCount">0</span> 筆）</h2><input type="text" id="searchCatalog" placeholder="搜尋色號或木名..." style="width: 240px; padding: 7px 10px;" autocomplete="off"></div>
            <table class="catalog-table">
                <thead><tr><th style="width: 30%;">色號</th><th style="width: 50%;">木名</th><th style="width: 20%;">操作</th></tr></thead>
                <tbody id="catalogTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
<script>
    let ordersDB = JSON.parse(localStorage.getItem('ordersMasterDB')) || {};
    let colorCatalog = JSON.parse(localStorage.getItem('colorCatalogDB')) || {};
    let currentOrder = null;

    renderOrderList();
    updateColorDatalist();

    function switchPage(page) {
        document.getElementById('pageOrders').style.display = page === 'orders' ? 'block' : 'none';
        document.getElementById('pageCatalog').style.display = page === 'catalog' ? 'block' : 'none';
        document.getElementById('tabOrdersBtn').classList.toggle('active', page === 'orders');
        document.getElementById('tabCatalogBtn').classList.toggle('active', page === 'catalog');
        if (page === 'catalog') renderCatalogTable();
        if (page === 'orders' && !currentOrder) renderOrderList();
    }

    // 安全跳脫字元處理 (防止 XSS 與特殊符號破壞 HTML)
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    document.getElementById('catalogForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const code = document.getElementById('catCode').value.trim();
        const name = document.getElementById('catName').value.trim();
        if (!code || !name) return;
        colorCatalog[code] = name; 
        saveCatalog();
        document.getElementById('catCode').value = ''; 
        document.getElementById('catName').value = '';
        document.getElementById('catCode').focus(); 
        renderCatalogTable();
    });

    function batchImportCatalog() {
        const text = document.getElementById('batchInput').value.trim();
        if (!text) return alert('請先貼上要匯入的資料！');
        let count = 0;
        text.split(/\r?\n/).forEach(line => {
            const match = line.trim().match(/^([^\t,，\s]+)[\t,，\s]+(.+)$/);
            if (match && match[1].trim() && match[2].trim()) {
                colorCatalog[match[1].trim()] = match[2].trim();
                count++;
            }
        });
        if (count > 0) { 
            saveCatalog(); 
            renderCatalogTable(); 
            document.getElementById('batchInput').value = ''; 
            alert(`成功匯入 ${count} 筆！`); 
        } else {
            alert('格式無法辨識，請確認每行都有「色號」與「木名」。');
        }
    }

    function clearCatalog() { 
        if (confirm('確定清空全部色號庫？')) { 
            colorCatalog = {}; 
            saveCatalog(); 
            renderCatalogTable(); 
        } 
    }

    document.getElementById('searchCatalog').addEventListener('input', renderCatalogTable);
    
    function editCatalogItem(code) { 
        document.getElementById('catCode').value = code; 
        document.getElementById('catName').value = colorCatalog[code] || ''; 
        document.getElementById('catName').focus(); 
    }
    
    function deleteCatalogItem(code) { 
        if (confirm(`刪除色號「${code}」？`)) { 
            delete colorCatalog[code]; 
            saveCatalog(); 
            renderCatalogTable(); 
        } 
    }
    
    function saveCatalog() { 
        localStorage.setItem('colorCatalogDB', JSON.stringify(colorCatalog)); 
        updateColorDatalist(); 
    }
    
    function updateColorDatalist() { 
        document.getElementById('colorHistoryList').innerHTML = Object.entries(colorCatalog)
            .map(([c, n]) => `<option value="${escapeHtml(c)}">${escapeHtml(n)}</option>`).join(''); 
    }

    function renderCatalogTable() {
        const kw = document.getElementById('searchCatalog').value.trim().toLowerCase();
        const entries = Object.entries(colorCatalog).filter(([c, n]) => c.toLowerCase().includes(kw) || n.toLowerCase().includes(kw));
        document.getElementById('catalogCount').textContent = Object.keys(colorCatalog).length;
        const tbody = document.getElementById('catalogTableBody');
        
        tbody.innerHTML = entries.length ? entries.map(([code, name]) => `
            <tr>
                <td><strong>${escapeHtml(code)}</strong></td>
                <td>${escapeHtml(name)}</td>
                <td>
                    <button class="btn" style="background:#3b82f6;color:#fff;padding:4px 10px;font-size:12px;" onclick="editCatalogItem('${escapeHtml(code)}')">修改</button>
                    <button class="btn-del" onclick="deleteCatalogItem('${escapeHtml(code)}')">刪除</button>
                </td>
            </tr>
        `).join('') : `<tr><td colspan="3" style="text-align:center;color:#9ca3af;padding:20px;">無符合資料</td></tr>`;
    }

    const colorInput = document.getElementById('colorCode');
    const woodInput = document.getElementById('woodName');

    // ⚡ 優化：直接透過 O(1) 索引對照，不用每次都用 .find() 掃描整個物件
    colorInput.addEventListener('input', function() {
        const code = this.value.trim();
        // 支援精準對應或忽略大小寫比對
        const matchedKey = Object.keys(colorCatalog).find(k => k.toLowerCase() === code.toLowerCase());
        if (matchedKey) {
            woodInput.value = colorCatalog[matchedKey];
        }
    });

    document.getElementById('createOrderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('newOrderId').value.trim();
        if (!id) return;
        if (!ordersDB[id]) { 
            ordersDB[id] = []; 
            saveOrders(); 
        }
        document.getElementById('newOrderId').value = '';
        openOrder(id);
    });

    function openOrder(orderId) {
        currentOrder = orderId;
        document.getElementById('viewOrders').style.display = 'none';
        document.getElementById('viewDetail').style.display = 'block';
        document.getElementById('currentOrderTitle').textContent = `訂單號：${orderId}`;
        renderDetailTable(); 
        colorInput.focus();
    }

    function goBack() {
        currentOrder = null;
        document.getElementById('viewDetail').style.display = 'none';
        document.getElementById('viewOrders').style.display = 'block';
        renderOrderList();
    }

    document.getElementById('addColorForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const colorCode = colorInput.value.trim();
        const woodName = woodInput.value.trim();
        const nQty = parseInt(document.getElementById('nestingQty').value, 10) || 0;
        const sQty = parseInt(document.getElementById('sawQty').value, 10) || 0;
        
        if (nQty === 0 && sQty === 0) return alert('請至少在一邊輸入數量！');

        if (!colorCatalog[colorCode]) { 
            colorCatalog[colorCode] = woodName; 
            saveCatalog(); 
        }
        
        const list = ordersDB[currentOrder];
        const existing = list.find(i => i.colorCode === colorCode);
        if (existing) { 
            existing.woodName = woodName; 
            existing.nestingQty += nQty; 
            existing.sawQty += sQty; 
        } else { 
            list.push({ colorCode, woodName, nestingQty: nQty, sawQty: sQty }); 
        }

        saveOrders(); 
        renderDetailTable();
        
        // ⚡ 操作優化：清空輸入並自動將焦點移回色號，方便連續輸入下一個色號
        colorInput.value = ''; 
        woodInput.value = '';
        document.getElementById('nestingQty').value = ''; 
        document.getElementById('sawQty').value = '';
        colorInput.focus();
    });

    function deleteColorRow(idx) { 
        ordersDB[currentOrder].splice(idx, 1); 
        saveOrders(); 
        renderDetailTable(); 
    }
    
    function deleteOrder(e, id) { 
        e.stopPropagation(); 
        if (confirm(`刪除訂單「${id}」及其所有分板明細？`)) { 
            delete ordersDB[id]; 
            saveOrders(); 
            renderOrderList(); 
        } 
    }
    
    function saveOrders() { 
        localStorage.setItem('ordersMasterDB', JSON.stringify(ordersDB)); 
    }

    function renderOrderList() {
        const grid = document.getElementById('orderListGrid');
        const keys = Object.keys(ordersDB).reverse();
        grid.innerHTML = keys.length ? keys.map(id => {
            const items = ordersDB[id];
            const nSum = items.reduce((s, i) => s + i.nestingQty, 0);
            const sSum = items.reduce((s, i) => s + i.sawQty, 0);
            return `
                <div class="order-item" onclick="openOrder('${escapeHtml(id)}')">
                    <button class="order-del-top" onclick="deleteOrder(event, '${escapeHtml(id)}')">刪除</button>
                    <h3>${escapeHtml(id)}</h3>
                    <div class="order-meta">色號：<strong>${items.length}</strong> 種<br>Nesting：<strong>${nSum}</strong> 片 ｜ 電子鋸：<strong>${sSum}</strong> 片</div>
                </div>`;
        }).join('') : `<div style="color:#6b7280;grid-column:1/-1;text-align:center;padding:20px;">尚無訂單</div>`;
    }

    function renderDetailTable() {
        const tbody = document.getElementById('detailTableBody');
        const items = ordersDB[currentOrder] || [];
        if (!items.length) { 
            tbody.innerHTML = `<tr><td colspan="5" style="color:#9ca3af;padding:30px;">尚無色號資料</td></tr>`; 
            return; 
        }

        let nTotal = 0, sTotal = 0;
        const rows = items.map((i, idx) => {
            nTotal += i.nestingQty; 
            sTotal += i.sawQty;
            const lbl = `<span class="merged-text">${escapeHtml(i.colorCode)}</span><span class="spec-sub merged-sub">${escapeHtml(i.woodName)}</span>`;
            return `<tr>
                <td class="cell-n">${i.nestingQty > 0 ? lbl : ''}</td>
                <td class="cell-n divider qty-bold">${i.nestingQty > 0 ? i.nestingQty : ''}</td>
                <td class="cell-s">${i.sawQty > 0 ? lbl : ''}</td>
                <td class="cell-s qty-bold">${i.sawQty > 0 ? i.sawQty : ''}</td>
                <td><button class="btn-del" onclick="deleteColorRow(${idx})">刪除</button></td>
            </tr>`;
        }).join('');
        
        tbody.innerHTML = rows + `
            <tr class="sum-row">
                <td style="text-align:right;">Nesting 合計：</td>
                <td class="divider" style="color:#1e40af;font-size:17px;">${nTotal} 片</td>
                <td style="text-align:right;">電子鋸 合計：</td>
                <td style="color:#b45309;font-size:17px;">${sTotal} 片</td>
                <td></td>
            </tr>`;
    }

    function exportSingleCSV() {
        const items = ordersDB[currentOrder] || [];
        if (!items.length) return alert('無資料可匯出');
        let csv = `\uFEFF訂單號,Nesting(色號/木名),Nesting數量,電子鋸(色號/木名),電子鋸數量\n`;
        items.forEach(i => {
            const nStr = i.nestingQty > 0 ? `${i.colorCode} ${i.woodName}` : '';
            const sStr = i.sawQty > 0 ? `${i.colorCode} ${i.woodName}` : '';
            csv += `"${currentOrder}","${nStr}",${i.nestingQty || ''},"${sStr}",${i.sawQty || ''}\n`;
        });
        downloadCSV(csv, `訂單_${currentOrder}.csv`);
    }

    function exportAllCSV() {
        const keys = Object.keys(ordersDB);
        if (!keys.length) return alert('無資料可匯出');
        let csv = `\uFEFF訂單號,Nesting(色號/木名),Nesting數量,電子鋸(色號/木名),電子鋸數量\n`;
        keys.forEach(id => {
            ordersDB[id].forEach(i => {
                const nStr = i.nestingQty > 0 ? `${i.colorCode} ${i.woodName}` : '';
                const sStr = i.sawQty > 0 ? `${i.colorCode} ${i.woodName}` : '';
                csv += `"${id}","${nStr}",${i.nestingQty || ''},"${sStr}",${i.sawQty || ''}\n`;
            });
        });
        downloadCSV(csv, `全部訂單分板總表.csv`);
    }

    function downloadCSV(csv, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = name; 
        a.click();
    }
</script>
</body>
</html>
