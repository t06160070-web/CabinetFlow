<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        html, body { overflow-x: hidden; max-width: 100vw; margin: 0; padding: 0; background: #eef2f6; color: #1f2937; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; }

        .nav-tabs { display: flex; gap: 12px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 14px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; text-align: center; }
        .tab-btn.active { background: #1e3a8a; color: #fff; box-shadow: 0 4px 12px rgba(30,58,138,0.25); }

        .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; width: 100%; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .header-bar h2 { margin: 0; font-size: 19px; color: #0f172a; }

        .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; width: 100%; }
        .field { display: flex; flex-direction: column; flex: 1; min-width: 150px; position: relative; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #475569; }
        input, textarea { padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; background: #fff; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn { padding: 11px 18px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-back { background: #475569; color: #fff; }
        .btn-export { background: #059669; color: #fff; }
        .btn-setting { background: #334155; color: #fff; }
        .btn-del { background: #ef4444; color: #fff; padding: 6px 10px; font-size: 13px; height: 32px; border-radius: 6px; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; width: 100%; }
        .order-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 18px; cursor: pointer; position: relative; }
        .order-item:hover { border-color: #2563eb; background: #eff6ff; }
        .order-item h3 { margin: 0 0 6px 0; font-size: 18px; color: #1e3a8a; }
        .order-meta { font-size: 13px; color: #475569; line-height: 1.6; }
        .order-del-top { position: absolute; top: 14px; right: 14px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-weight: bold; font-size: 12px; }

        .autocomplete-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.12); max-height: 220px; overflow-y: auto; z-index: 99; margin-top: 4px; }
        .autocomplete-item { padding: 11px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
        .autocomplete-item:hover { background: #eff6ff; color: #1d4ed8; }

        .table-wrap { padding: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table.align-table { width: 100%; min-width: 480px; border-collapse: collapse; table-layout: fixed; }
        .align-table th, .align-table td { padding: 13px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 15px; word-break: break-word; }
        .th-color { background: #f1f5f9; color: #0f172a; font-size: 15px; border-right: 2px solid #cbd5e1; text-align: left; padding-left: 12px !important; }
        .th-nesting { background: #dbeafe; color: #1e40af; font-size: 15px; border-right: 2px solid #94a3b8; }
        .th-saw { background: #fef3c7; color: #92400e; font-size: 15px; border-right: 2px solid #94a3b8; }
        .th-action { background: #f1f5f9; color: #334155; font-size: 13px; }
        .divider { border-right: 2px solid #94a3b8 !important; }
        .cell-color { background: #ffffff; text-align: left !important; padding-left: 12px !important; border-right: 2px solid #cbd5e1 !important; }
        .cell-n { background: #f8fafc; color: #1e40af; }
        .cell-s { background: #fffdf7; color: #b45309; }
        .merged-text { font-weight: bold; color: #111827; font-size: 15px; }
        .merged-sub { font-weight: normal; color: #4b5563; margin-left: 5px; font-size: 13px; }
        .qty-bold { font-weight: bold; font-size: 18px; }
        .qty-empty { color: #cbd5e1; font-size: 15px; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; font-size: 15px; }

        table.catalog-table { width: 100%; border-collapse: collapse; }
        .catalog-table th, .catalog-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        .catalog-table th { background: #f8fafc; color: #334155; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-overlay.open { display: flex; }
        .modal-card { background: #fff; width: 100%; max-width: 450px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .modal-header h3 { margin: 0; color: #1e3a8a; font-size: 18px; }
        .modal-close { background: none; border: none; font-size: 24px; font-weight: bold; cursor: pointer; color: #64748b; line-height: 1; }
        .modal-body { display: flex; flex-direction: column; gap: 14px; }

        @media (max-width: 768px) {
            .container { padding: 12px; }
            .card { padding: 16px; }
            .tab-btn { padding: 12px 10px; font-size: 14px; }
            .align-table th, .align-table td { padding: 10px 6px; font-size: 13px; }
            .th-color, .cell-color { padding-left: 8px !important; }
            .merged-text { font-size: 13px; }
            .merged-sub { display: block; margin-left: 0; font-size: 12px; }
            .qty-bold { font-size: 15px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-tabs">
        <button type="button" id="tabOrdersBtn" class="tab-btn active">📋 訂單分板作業</button>
        <button type="button" id="tabCatalogBtn" class="tab-btn">🎨 色號對照表</button>
    </div>

    <div id="pageOrders">
        <div id="viewOrders">
            <div class="card">
                <div class="header-bar">
                    <h2>訂單管理</h2>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button type="button" id="btnNewOrder" class="btn btn-primary">➕ 新建訂單</button>
                        <button type="button" id="btnOpenWidth" class="btn btn-setting">⚙️ 機台欄寬</button>
                        <button type="button" id="btnExportAll" class="btn btn-export">匯出全部總表</button>
                    </div>
                </div>
                <p style="color:#64748b; font-size:14px; margin:0;">
                    目前欄寬（色號 / Nesting / 電子鋸 / 操作）：<strong id="widthSummaryText" style="color:#1e3a8a;">30% / 28% / 28% / 14%</strong>
                </p>
            </div>
            <div class="card">
                <div class="header-bar"><h2>已建立的訂單列表</h2></div>
                <div id="orderListGrid" class="order-grid"></div>
            </div>
        </div>

        <div id="viewDetail" style="display: none;">
            <div class="card">
                <div class="header-bar">
                    <div>
                        <button type="button" id="btnGoBack" class="btn btn-back" style="height: 38px; padding: 6px 14px; font-size: 14px;">返回列表</button>
                        <span id="currentOrderTitle" style="font-size: 15px; font-weight: bold; margin-left: 10px; color: #1e3a8a;"></span>
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button type="button" id="btnOpenItem" class="btn btn-primary" style="height: 38px; padding: 6px 14px; font-size: 14px;">➕ 加入色號</button>
                        <button type="button" id="btnOpenWidthDetail" class="btn btn-setting" style="height: 38px; padding: 6px 14px; font-size: 14px;">⚙️ 機台欄寬</button>
                        <button type="button" id="btnExportSingle" class="btn btn-export" style="height: 38px; padding: 6px 14px; font-size: 14px;">匯出此單 Excel</button>
                    </div>
                </div>
            </div>

            <div class="card table-wrap">
                <table class="align-table">
                    <thead>
                        <tr>
                            <th id="thColor" class="th-color" style="width: 30%;">色號 / 木名</th>
                            <th id="thM1" class="th-nesting" style="width: 28%;">Nesting 數量</th>
                            <th id="thM2" class="th-saw" style="width: 28%;">電子鋸 數量</th>
                            <th id="thAction" class="th-action" style="width: 14%;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="detailTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="pageCatalog" style="display: none;">
        <div class="card">
            <div class="header-bar"><h2>新增 / 修改 色號對照</h2></div>
            <form id="catalogForm" class="row">
                <div class="field" style="max-width: 200px;"><label>色號 *</label><input type="text" id="catCode" placeholder="例: H3303" required autocomplete="off"></div>
                <div class="field" style="max-width: 300px;"><label>木名 *</label><input type="text" id="catName" placeholder="例: 漢密爾頓橡木" required autocomplete="off"></div>
                <button type="submit" class="btn btn-primary">儲存對照</button>
            </form>
        </div>
        <div class="card">
            <div class="header-bar"><h2>📥 批次匯入對照表</h2></div>
            <p style="font-size:13px; color:#475569; margin-top:0;">每行一筆，用 <strong>Tab</strong>、<strong>空格</strong> 或 <strong>逗號</strong> 分隔。</p>
            <textarea id="batchInput" rows="4" style="width:100%;" placeholder="H3303 漢密爾頓橡木&#10;701 雪白"></textarea>
            <div style="margin-top: 12px; display:flex; justify-content:space-between; gap: 10px; flex-wrap: wrap;">
                <button type="button" id="btnBatchImport" class="btn btn-export">⚡ 執行批次匯入</button>
                <button type="button" id="btnClearCatalog" class="btn btn-del" style="height: 44px; font-size: 14px;">清空全部</button>
            </div>
        </div>
        <div class="card">
            <div class="header-bar"><h2>已建檔色號（<span id="catalogCount">0</span> 筆）</h2><input type="text" id="searchCatalog" placeholder="搜尋色號或木名..." style="width: 220px; padding: 9px 12px;" autocomplete="off"></div>
            <div style="overflow-x: auto;">
                <table class="catalog-table">
                    <thead><tr><th>色號</th><th>木名</th><th style="width: 130px;">操作</th></tr></thead>
                    <tbody id="catalogTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 彈窗 A：建立訂單 -->
<div id="orderModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>建立新訂單</h3>
            <button type="button" id="closeOrderModalBtn" class="modal-close">&times;</button>
        </div>
        <form id="orderModalForm" class="modal-body">
            <div class="field"><label>新訂單號 *</label><input type="text" id="modalOrderId" placeholder="例: ORD-001" required autocomplete="off"></div>
            <div class="field"><label>案名</label><input type="text" id="modalProjectName" placeholder="例: 王先生案" autocomplete="off"></div>
            <div class="field"><label>出貨日期</label><input type="date" id="modalShipDate"></div>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">確認建立並進入</button>
        </form>
    </div>
</div>

<!-- 彈窗 B：加入色號 -->
<div id="itemModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>加入板材色號</h3>
            <button type="button" id="closeItemModalBtn" class="modal-close">&times;</button>
        </div>
        <form id="itemModalForm" class="modal-body">
            <div class="field">
                <label>板材色號 *</label>
                <input type="text" id="modalColorCode" placeholder="輸入色號或木名關鍵字..." autocomplete="off" required>
                <div id="modalDropdown" class="autocomplete-dropdown"></div>
            </div>
            <div class="field"><label>木名 *</label><input type="text" id="modalWoodName" placeholder="自動帶出" required autocomplete="off"></div>
            <div class="row" style="gap: 10px;">
                <div class="field"><label style="color:#1e40af;">Nesting 數</label><input type="number" id="modalNestingQty" min="0" placeholder="留空"></div>
                <div class="field"><label style="color:#b45309;">電子鋸 數</label><input type="number" id="modalSawQty" min="0" placeholder="留空"></div>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">確認加入色號</button>
        </form>
    </div>
</div>

<!-- 彈窗 C：機台欄寬微調 -->
<div id="widthModal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <h3>微調機台欄寬 (%)</h3>
            <button type="button" id="closeWidthModalBtn" class="modal-close">&times;</button>
        </div>
        <form id="widthModalForm" class="modal-body">
            <div class="row" style="gap: 10px;">
                <div class="field"><label>色號/木名 (%)</label><input type="number" id="wColorInput" min="15" max="60" required></div>
                <div class="field"><label>操作欄 (%)</label><input type="number" id="wActionInput" min="8" max="30" required></div>
            </div>
            <div class="row" style="gap: 10px;">
                <div class="field"><label style="color:#1e40af;">Nesting (%)</label><input type="number" id="wM1Input" min="10" max="60" required></div>
                <div class="field"><label style="color:#b45309;">電子鋸 (%)</label><input type="number" id="wM2Input" min="10" max="60" required></div>
            </div>
            <div style="display:flex; gap:10px; margin-top: 10px;">
                <button type="button" id="btnResetWidths" class="btn btn-back" style="flex:1;">恢復預設</button>
                <button type="submit" class="btn btn-primary" style="flex:2;">套用欄寬</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    const DEFAULT_WIDTHS = { wColor: 30, wM1: 28, wM2: 28, wAction: 14 };
    let ordersDB = {};
    let colorCatalog = {};
    let colWidths = { ...DEFAULT_WIDTHS };
    let currentOrder = null;

    try { ordersDB = JSON.parse(localStorage.getItem('ordersMasterDBV16')) || {}; } catch (e) { ordersDB = {}; }
    try { colorCatalog = JSON.parse(localStorage.getItem('colorCatalogDB')) || {}; } catch (e) { colorCatalog = {}; }
    try { colWidths = Object.assign({}, DEFAULT_WIDTHS, JSON.parse(localStorage.getItem('colWidthsDB')) || {}); } catch (e) { colWidths = { ...DEFAULT_WIDTHS }; }

    function $(id) { return document.getElementById(id); }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function applyWidths() {
        const wColor = Number(colWidths.wColor) || DEFAULT_WIDTHS.wColor;
        const wM1 = Number(colWidths.wM1) || DEFAULT_WIDTHS.wM1;
        const wM2 = Number(colWidths.wM2) || DEFAULT_WIDTHS.wM2;
        const wAction = Number(colWidths.wAction) || DEFAULT_WIDTHS.wAction;

        if ($('thColor'))$('thColor').style.width = wColor + '%';
        if ($('thM1'))$('thM1').style.width = wM1 + '%';
        if ($('thM2'))$('thM2').style.width = wM2 + '%';
        if ($('thAction'))$('thAction').style.width = wAction + '%';
        if ($('widthSummaryText'))$('widthSummaryText').textContent = `${wColor}% / ${wM1}% / ${wM2}% / ${wAction}%`;
    }

    function openWidthModal() {
        $('wColorInput').value = colWidths.wColor;
        $('wM1Input').value = colWidths.wM1;
        $('wM2Input').value = colWidths.wM2;
        $('wActionInput').value = colWidths.wAction;
        $('widthModal').classList.add('open');
        setTimeout(() => { if ($('wM1Input'))$('wM1Input').focus(); }, 80);
    }

    function closeWidthModal() {
        $('widthModal').classList.remove('open');
    }

    function switchPage(page) {
        $('pageOrders').style.display = page === 'orders' ? 'block' : 'none';$('pageCatalog').style.display = page === 'catalog' ? 'block' : 'none';
        $('tabOrdersBtn').classList.toggle('active', page === 'orders');$('tabCatalogBtn').classList.toggle('active', page === 'catalog');
        if (page === 'catalog') renderCatalogTable();
        if (page === 'orders' && !currentOrder) renderOrderList();
    }

    function openOrderModal() {
        $('orderModal').classList.add('open');
        setTimeout(() => { if ($('modalOrderId'))$('modalOrderId').focus(); }, 80);
    }

    function closeOrderModal() {
        $('orderModal').classList.remove('open');$('orderModalForm').reset();
    }

    function openItemModal() {
        $('itemModal').classList.add('open');
        setTimeout(() => { if ($('modalColorCode'))$('modalColorCode').focus(); }, 80);
    }

    function closeItemModal() {
        $('itemModal').classList.remove('open');
        $('itemModalForm').reset();$('modalDropdown').style.display = 'none';
    }

    function saveOrders() {
        try { localStorage.setItem('ordersMasterDBV16', JSON.stringify(ordersDB)); } catch (e) {}
    }

    function saveCatalog() {
        try { localStorage.setItem('colorCatalogDB', JSON.stringify(colorCatalog)); } catch (e) {}
    }

    function openOrder(orderId) {
        currentOrder = orderId;
        const orderData = ordersDB[orderId] || {};
        $('viewOrders').style.display = 'none';
        $('viewDetail').style.display = 'block';$('currentOrderTitle').textContent = `[${orderId}] ${orderData.projectName || '未命名'} (出貨: ${orderData.shipDate || '未定'})`;
        applyWidths();
        renderDetailTable();
    }

    function goBack() {
        currentOrder = null;
        $('viewDetail').style.display = 'none';$('viewOrders').style.display = 'block';
        renderOrderList();
    }

    function renderOrderList() {
        const grid = $('orderListGrid');
        if (!grid) return;
        const keys = Object.keys(ordersDB).reverse();
        grid.innerHTML = keys.length ? keys.map(id => {
            const orderObj = ordersDB[id] || {};
            const items = orderObj.items || [];
            const nSum = items.reduce((s, i) => s + (Number(i.nestingQty) || 0), 0);
            const sSum = items.reduce((s, i) => s + (Number(i.sawQty) || 0), 0);
            return `
                <div class="order-item" data-order-id="${escapeHtml(id)}">
                    <button type="button" class="order-del-top" data-del-order="${escapeHtml(id)}">刪除</button>
                    <h3>${escapeHtml(id)}</h3>
                    <div class="order-meta">
                        案名：<strong>${escapeHtml(orderObj.projectName || '未填寫')}</strong><br>
                        出貨日：<strong>${escapeHtml(orderObj.shipDate || '未定')}</strong><br>
                        Nesting：<strong>${nSum}</strong> 片 ｜ 電子鋸：<strong>${sSum}</strong> 片
                    </div>
                </div>`;
        }).join('') : `<div style="color:#6b7280;grid-column:1/-1;text-align:center;padding:20px;">尚無訂單</div>`;
    }

    function renderDetailTable() {
        const tbody = $('detailTableBody');
        if (!tbody || !currentOrder) return;
        const orderObj = ordersDB[currentOrder] || { items: [] };
        const items = orderObj.items || [];

        if (!items.length) {
            tbody.innerHTML = `<tr><td colspan="4" style="color:#9ca3af;padding:30px;">尚無色號資料，點擊上方「加入色號」開始建立。</td></tr>`;
            return;
        }

        let nTotal = 0, sTotal = 0;
        tbody.innerHTML = items.map((i, idx) => {
            const nQty = Number(i.nestingQty) || 0;
            const sQty = Number(i.sawQty) || 0;
            nTotal += nQty;
            sTotal += sQty;
            return `<tr>
                <td class="cell-color">
                    <span class="merged-text">${escapeHtml(i.colorCode)}</span>
                    <span class="merged-sub">${escapeHtml(i.woodName)}</span>
                </td>
                <td class="cell-n divider ${nQty > 0 ? 'qty-bold' : 'qty-empty'}">${nQty > 0 ? nQty : '-'}</td>
                <td class="cell-s divider ${sQty > 0 ? 'qty-bold' : 'qty-empty'}">${sQty > 0 ? sQty : '-'}</td>
                <td><button type="button" class="btn-del" data-del-row="${idx}">刪除</button></td>
            </tr>`;
        }).join('') + `
            <tr class="sum-row">
                <td style="text-align:right; color:#334155; border-right:2px solid #cbd5e1;">合計：</td>
                <td class="divider" style="color:#1e40af; font-size:17px;">${nTotal} 片</td>
                <td class="divider" style="color:#b45309; font-size:17px;">${sTotal} 片</td>
                <td></td>
            </tr>`;
    }

    function renderCatalogTable() {
        const kw = ($('searchCatalog').value || '').trim().toLowerCase();
        const entries = Object.entries(colorCatalog).filter(([c, n]) =>
            c.toLowerCase().includes(kw) || String(n).toLowerCase().includes(kw)
        );
        $('catalogCount').textContent = Object.keys(colorCatalog).length;
        $('catalogTableBody').innerHTML = entries.length ? entries.map(([code, name]) =>
