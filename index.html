<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { margin: 0; padding: 14px 12px; background: #eef2f6; color: #1f2937; }
        .wrap { max-width: 1050px; margin: 0 auto; }
        .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 14px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

        /* 主按鈕與常用按鈕 */
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; background: #2563eb; }
        .btn-gray { background: #475569; }
        .btn-green { background: #059669; }
        .btn-purple { background: #7c3aed; }
        .btn-red { background: #ef4444; padding: 6px 10px; font-size: 13px; }

        /* 低調次要工具按鈕（欄寬、匯出、修改單據） */
        .btn-sub {
            padding: 7px 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #475569;
            background: #f8fafc;
        }
        .btn-sub:hover { background: #e2e8f0; color: #1e293b; }
        .btn-back-compact { padding: 7px 12px; font-size: 14px; }

        /* 頂部操作區排版 */
        .header-stack { display: flex; flex-direction: column; gap: 10px; }
        .header-row-main { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .header-row-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        /* 明細頁單據資訊：單號在上、案名與出貨日期在下 */
        .detail-top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .detail-left { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
        .detail-info-stack { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
        .detail-order-id { font-size: 18px; font-weight: 800; color: #1e3a8a; line-height: 1.25; word-break: break-word; }
        .detail-sub-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13.5px; color: #475569; line-height: 1.4; }
        .detail-project { font-weight: 600; color: #334155; word-break: break-word; }
        .detail-date { color: #64748b; }

        @media (max-width: 600px) {
            .btn-primary-mobile { width: 100%; padding: 11px 16px; font-size: 15px; }
            .tools-pair-mobile { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .tools-pair-mobile .btn-sub { width: 100%; text-align: center; }
        }

        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; }
        .tab.active { background: #1e3a8a; color: #fff; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
        .order-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; cursor: pointer; position: relative; }
        .order-box:hover { border-color: #2563eb; background: #eff6ff; }
        .order-del-btn { position: absolute; top: 10px; right: 10px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 11px 6px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 15px; vertical-align: middle; word-break: break-word; }
        th.col-color, td.col-color { text-align: left; padding-left: 12px; }
        th.th-m1 { background: #dbeafe; color: #1e40af; }
        th.th-loc { background: #f1f5f9; color: #334155; }
        th.th-m2 { background: #fef3c7; color: #92400e; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; }

        .color-edit-cell { cursor: pointer; transition: background 0.15s; }
        .color-edit-cell:hover { background: #eff6ff; }
        .loc-badge { display: inline-block; background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; font-weight: bold; font-size: 13px; padding: 3px 8px; border-radius: 6px; }

        .prep-cell { cursor: pointer; user-select: none; transition: background 0.15s, color 0.15s; }
        .prep-cell:hover { filter: brightness(0.96); }
        .prep-done { background: #e2e8f0 !important; color: #94a3b8 !important; }
        .prep-done strong { color: #94a3b8; text-decoration: line-through; }

        .code-line { display: block; font-size: 14px; font-weight: bold; color: #111827; line-height: 1.3; }
        .wood-subline { display: block; font-size: 11.5px; font-weight: normal; color: #64748b; line-height: 1.35; margin-top: 2px; }

        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; padding: 16px; z-index: 999; }
        .modal-card { background: #fff; width: 100%; max-width: 440px; padding: 20px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; flex: 1; position: relative; }
        label { font-size: 13px; font-weight: bold; color: #475569; }
        input, textarea { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; background: #fff; }
        .row2 { display: flex; gap: 10px; }

        .type-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 30; box-shadow: 0 6px 14px rgba(0,0,0,0.12); }
        .type-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
        .type-item:hover { background: #eff6ff; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="tabs">
        <button type="button" id="tabOrders" class="tab active">📋 訂單分板</button>
        <button type="button" id="tabCatalog" class="tab">🎨 色號對照表</button>
    </div>

    <div id="secOrders">
        <div id="listView">
            <div class="card header-stack">
                <div class="header-row-main">
                    <h2 style="margin:0; font-size:19px;">訂單分板管理</h2>
                    <button type="button" id="btnNewOrder" class="btn btn-primary-mobile">➕ 新建訂單</button>
                </div>
                <div class="header-row-tools tools-pair-mobile">
                    <button type="button" id="btnWidthList" class="btn-sub">⚙️ 機台欄寬</button>
                    <button type="button" id="btnExportAll" class="btn-sub">📤 匯出全部 CSV</button>
                </div>
            </div>
            <div class="card">
                <div id="orderList" class="order-grid"></div>
            </div>
        </div>

        <div id="detailView" style="display:none;">
            <div class="card header-stack">
                <div class="detail-top-bar">
                    <div class="detail-left">
                        <button type="button" id="btnBack" class="btn btn-gray btn-back-compact">← 返回</button>
                        <div class="detail-info-stack">
                            <div id="detailOrderId" class="detail-order-id"></div>
                            <div class="detail-sub-meta">
                                <span id="detailProject" class="detail-project"></span>
                                <span id="detailDate" class="detail-date"></span>
                            </div>
                        </div>
                    </div>
                    <button type="button" id="btnEditOrder" class="btn-sub">✏️ 修改單據</button>
                </div>
                <div class="header-row-main">
                    <button type="button" id="btnAddItem" class="btn btn-primary-mobile">➕ 加入色號</button>
                    <div class="header-row-tools tools-pair-mobile">
                        <button type="button" id="btnWidthDetail" class="btn-sub">⚙️ 機台欄寬</button>
                        <button type="button" id="btnExportOne" class="btn-sub">📤 匯出此單</button>
                    </div>
                </div>
            </div>
            <div class="card" style="padding:0; overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th id="thColor" class="col-color" style="width:32%;">色號 / 木名</th>
                            <th id="thM1" class="th-m1" style="width:24%;">Nesting 數量</th>
                            <th id="thLoc" class="th-loc" style="width:20%;">儲位</th>
                            <th id="thM2" class="th-m2" style="width:24%;">電子鋸 數量</th>
                        </tr>
                    </thead>
                    <tbody id="detailBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="secCatalog" style="display:none;">
        <div class="card">
            <div class="top-bar" style="margin-bottom:12px;">
                <h3 style="margin:0;">新增 / 修改 色號對照</h3>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button type="button" id="btnNewCatList" class="btn-sub" style="color:#059669; border-color:#a7f3d0; background:#ecfdf5;">➕ 批次清單</button>
                    <button type="button" id="btnExportCat" class="btn-sub">📤 匯出對照</button>
                </div>
            </div>
            <div class="row2" style="flex-wrap:wrap;">
                <div class="field"><label>色號 *</label><input type="text" id="catCode" autocomplete="off" placeholder="例: H3303"></div>
                <div class="field"><label>木名 *</label><input type="text" id="catWood" autocomplete="off" placeholder="例: 漢密爾頓橡木"></div>
                <div class="field"><label>儲位</label><input type="text" id="catLoc" autocomplete="off" placeholder="例: A01"></div>
                <div style="display:flex; align-items:flex-end; margin-bottom:12px;">
                    <button type="button" id="btnSaveCat" class="btn">儲存</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="top-bar" style="margin-bottom:12px;">
                <h3 style="margin:0;">已建檔色號（<span id="catCount">0</span>）</h3>
                <input type="text" id="catSearch" autocomplete="off" placeholder="搜尋色號、木名或儲位..." style="max-width:220px;">
            </div>
            <table>
                <thead>
                    <tr>
                        <th class="col-color" style="width:26%;">色號</th>
                        <th class="col-color" style="width:36%;">木名</th>
                        <th style="width:20%;">儲位</th>
                        <th style="width:18%;">操作</th>
                    </tr>
                </thead>
                <tbody id="catBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 彈窗1：新建訂單 -->
<div id="orderModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">建立新訂單</h3>
        <div class="field">
            <label>訂單號 *</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="inOrderId" autocomplete="off" placeholder="輸入或掃描單號">
                <button type="button" id="btnOpenCam" class="btn btn-purple" style="white-space:nowrap;">📷 掃描</button>
            </div>
        </div>
        <div class="field"><label>案名</label><input type="text" id="inProject" autocomplete="off"></div>
        <div class="field"><label>出貨日期</label><input type="date" id="inDate" autocomplete="off"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" id="btnCancelOrder" class="btn btn-gray">取消</button>
            <button type="button" id="btnConfirmOrder" class="btn">確定建立</button>
        </div>
    </div>
</div>

<!-- 彈窗2：加入 / 修改 色號 -->
<div id="itemModal" class="modal-bg">
    <div class="modal-card">
        <h3 id="itemModalTitle" style="margin-top:0;">加入板材色號</h3>
        <div class="field">
            <label>色號 *</label>
            <input type="text" id="inCode" autocomplete="off" placeholder="打字搜尋預設 / 已建檔色號...">
            <div id="typeColorList" class="type-list"></div>
        </div>
        <div class="row2">
            <div class="field" style="flex:2;"><label>木名 *</label><input type="text" id="inWood" autocomplete="off" placeholder="例: 漢密爾頓橡木"></div>
            <div class="field" style="flex:1;"><label>儲位</label><input type="text" id="inLoc" autocomplete="off" placeholder="例: A01"></div>
        </div>
        <div class="row2">
            <div class="field"><label>Nesting 數</label><input type="number" id="inN" min="0" inputmode="numeric" autocomplete="off"></div>
            <div class="field"><label>電子鋸 數</label><input type="number" id="inS" min="0" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div style="display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:14px;">
            <button type="button" id="btnDeleteItem" class="btn btn-red" style="display:none; padding:10px 14px; font-size:14px;">🗑️ 刪除此筆</button>
            <div style="display:flex; gap:10px; margin-left:auto;">
                <button type="button" id="btnCancelItem" class="btn btn-gray">取消</button>
                <button type="button" id="btnConfirmItem" class="btn">確認儲存</button>
            </div>
        </div>
    </div>
</div>

<!-- 彈窗3：機台欄寬微調 -->
<div id="widthModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">微調欄位寬度 (%)</h3>
        <div class="row2">
            <div class="field"><label>色號/木名 (%)</label><input type="number" id="wColor" min="15" max="60" inputmode="numeric" autocomplete="off"></div>
            <div class="field"><label>儲位 (%)</label><input type="number" id="wLoc" min="8" max="40" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div class="row2">
            <div class="field"><label>Nesting (%)</label><input type="number" id="wM1" min="10" max="60" inputmode="numeric" autocomplete="off"></div>
            <div class="field"><label>電子鋸 (%)</label><input type="number" id="wM2" min="10" max="60" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" id="btnCancelWidth" class="btn btn-gray">取消</button>
            <button type="button" id="btnConfirmWidth" class="btn">套用</button>
        </div>
    </div>
</div>

<!-- 彈窗4：相機掃描 -->
<div id="camModal" class="modal-bg" style="z-index:1100;">
    <div class="modal-card" style="text-align:center;">
        <h3 style="margin-top:0;">掃描訂單 QR Code</h3>
        <video id="camVideo" autoplay playsinline style="width:100%; height:220px; background:#000; border-radius:8px; object-fit:cover;"></video>
        <canvas id="camCanvas" style="display:none;"></canvas>
        <p id="camStatus" style="font-size:13px; color:#64748b;">準備開啟鏡頭...</p>
        <button type="button" id="btnCloseCam" class="btn btn-gray" style="width:100%;">關閉相機</button>
    </div>
</div>

<!-- 彈窗5：新建清單 -->
<div id="catalogListModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">新建色號清單</h3>
        <div class="field">
            <label>每行一筆（格式：色號 木名 [儲位]，用空白或逗號分隔）</label>
            <textarea id="modalCatList" rows="6" placeholder="H3303 漢密爾頓橡木 A01&#10;701 雪白 B02"></textarea>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" id="btnCancelCatList" class="btn btn-gray">取消</button>
            <button type="button" id="btnConfirmCatList" class="btn btn-green">⚡ 匯入對照</button>
        </div>
    </div>
</div>

<!-- 彈窗6：修改單據 -->
<div id="editOrderModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">修改訂單資訊</h3>
        <div class="field"><label>訂單號</label><input type="text" id="editOrderId" disabled style="background:#f1f5f9;"></div>
        <div class="field"><label>案名</label><input type="text" id="editProject" autocomplete="off"></div>
        <div class="field"><label>出貨日期</label><input type="date" id="editDate" autocomplete="off"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" id="btnCancelEditOrder" class="btn btn-gray">取消</button>
            <button type="button" id="btnConfirmEditOrder" class="btn">儲存修改</button>
        </div>
    </div>
</div>

<script>
const DEFAULT_CATALOG = {
    'H3303': { wood: '漢密爾頓橡木', loc: 'A01' },
    '701': { wood: '雪白', loc: 'A02' },
    'U999': { wood: '炭黑', loc: 'B01' },
    'H1145': { wood: '巴登白橡', loc: 'B02' },
    'W1000': { wood: '尊貴白', loc: 'C01' }
};

function normalizeCatalog(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object') return out;
    Object.entries(raw).forEach(([c, v]) => {
        if (typeof v === 'string') {
            out[c] = { wood: v, loc: '' };
        } else if (v && typeof v === 'object') {
            out[c] = { wood: v.wood || '', loc: v.loc || '' };
        }
    });
    return out;
}

let db = {};
let catalog = normalizeCatalog(DEFAULT_CATALOG);
let widths = { color: 32, m1: 24, loc: 20, m2: 24 };
let curId = null;
let editItemIdx = null;
let camStream = null;
let camActive = false;

try {
    const sDb = localStorage.getItem('boardSystemDB_v5');
    if (sDb) db = JSON.parse(sDb);
} catch (e) {}

try {
    const sCat = localStorage.getItem('boardSystemCatalog_v5');
    if (sCat) {
        const parsed = normalizeCatalog(JSON.parse(sCat));
        if (Object.keys(parsed).length > 0) catalog = parsed;
    }
} catch (e) {}

try {
    const sW = localStorage.getItem('boardSystemWidths_v6');
    if (sW) widths = Object.assign(widths, JSON.parse(sW));
} catch (e) {}

function saveAll() {
    try {
        localStorage.setItem('boardSystemDB_v5', JSON.stringify(db));
        localStorage.setItem('boardSystemCatalog_v5', JSON.stringify(catalog));
        localStorage.setItem('boardSystemWidths_v6', JSON.stringify(widths));
    } catch (e) {}
}

function applyWidths() {
    document.getElementById('thColor').style.width = widths.color + '%';
    document.getElementById('thM1').style.width = widths.m1 + '%';
    document.getElementById('thLoc').style.width = widths.loc + '%';
    document.getElementById('thM2').style.width = widths.m2 + '%';
}

function renderDetailHeader(id, o) {
    document.getElementById('detailOrderId').textContent = id;
    document.getElementById('detailProject').textContent = '案名：' + (o.project || '未命名');
    document.getElementById('detailDate').textContent = '出貨：' + (o.date || '未定');
}

function switchTab(tab) {
    document.getElementById('secOrders').style.display = tab === 'orders' ? 'block' : 'none';
    document.getElementById('secCatalog').style.display = tab === 'catalog' ? 'block' : 'none';
    document.getElementById('tabOrders').classList.toggle('active', tab === 'orders');
    document.getElementById('tabCatalog').classList.toggle('active', tab === 'catalog');
    if (tab === 'catalog') renderCatalog();
    if (tab === 'orders' && !curId) renderOrders();
}

function renderOrders() {
    const wrap = document.getElementById('orderList');
    const keys = Object.keys(db).reverse();
    if (!keys.length) {
        wrap.innerHTML = '<div style="color:#64748b;">尚無訂單，點上方「➕ 新建訂單」開始。</div>';
        return;
    }
    wrap.innerHTML = '';
    keys.forEach(id => {
        const o = db[id] || { items: [] };
        const nSum = (o.items || []).reduce((a, b) => a + (Number(b.n) || 0), 0);
        const sSum = (o.items || []).reduce((a, b) => a + (Number(b.s) ||
