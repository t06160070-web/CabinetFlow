<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        html, body { overflow-x: hidden; max-width: 100vw; margin: 0; padding: 0; background: #eef2f6; color: #1f2937; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; }

        .nav-tabs { display: flex; gap: 12px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 14px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; text-align: center; }
        .tab-btn.active { background: #1e3a8a; color: #fff; box-shadow: 0 4px 12px rgba(30,58,138,0.25); }

        .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; width: 100%; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .header-bar h2 { margin: 0; font-size: 19px; color: #0f172a; }

        .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; width: 100%; }
        .field { display: flex; flex-direction: column; flex: 1; min-width: 150px; position: relative; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #475569; }
        input, textarea { padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; background: #fff; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

        .btn { padding: 11px 18px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-back { background: #475569; color: #fff; }
        .btn-export { background: #059669; color: #fff; }
        .btn-setting { background: #334155; color: #fff; }
        .btn-del { background: #ef4444; color: #fff; padding: 6px 10px; font-size: 13px; height: 32px; border-radius: 6px; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; width: 100%; }
        .order-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 18px; cursor: pointer; position: relative; }
        .order-item:hover { border-color: #2563eb; background: #eff6ff; }
        .order-item h3 { margin: 0 0 6px 0; font-size: 18px; color: #1e3a8a; }
        .order-meta { font-size: 13px; color: #475569; line-height: 1.6; }
        .order-del-top { position: absolute; top: 14px; right: 14px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-weight: bold; font-size: 12px; }

        .autocomplete-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.12); max-height: 220px; overflow-y: auto; z-index: 99; margin-top: 4px; }
        .autocomplete-item { padding: 11px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
        .autocomplete-item:hover { background: #eff6ff; color: #1d4ed8; }

        .table-wrap { padding: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table.align-table { width: 100%; min-width: 480px; border-collapse: collapse; table-layout: fixed; }
        .align-table th, .align-table td { padding: 13px 8px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 15px; word-break: break-word; }
        .th-color { background: #f1f5f9; color: #0f172a; font-size: 15px; border-right: 2px solid #cbd5e1; text-align: left; padding-left: 12px !important; }
        .th-nesting { background: #dbeafe; color: #1e40af; font-size: 15px; border-right: 2px solid #94a3b8; }
        .th-saw { background: #fef3c7; color: #92400e; font-size: 15px; border-right: 2px solid #94a3b8; }
        .th-action { background: #f1f5f9; color: #334155; font-size: 13px; }
        .divider { border-right: 2px solid #94a3b8 !important; }
        .cell-color { background: #ffffff; text-align: left !important; padding-left: 12px !important; border-right: 2px solid #cbd5e1 !important; }
        .cell-n { background: #f8fafc; color: #1e40af; }
        .cell-s { background: #fffdf7; color: #b45309; }
        .merged-text { font-weight: bold; color: #111827; font-size: 15px; }
        .merged-sub { font-weight: normal; color: #4b5563; margin-left: 5px; font-size: 13px; }
        .qty-bold { font-weight: bold; font-size: 18px; }
        .qty-empty { color: #cbd5e1; font-size: 15px; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; font-size: 15px; }

        table.catalog-table { width: 100%; border-collapse: collapse; }
        .catalog-table th, .catalog-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        .catalog-table th { background: #f8fafc; color: #334155; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-overlay.open { display: flex; }
        .modal-card { background: #fff; width: 100%; max-width: 450px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .modal-header h3 { margin: 0; color: #1e3a8a; font-size: 18px; }
        .modal-close { background: none; border: none; font-size: 24px; font-weight: bold; cursor: pointer; color: #64748b; line-height: 1; }
        .modal-body { display: flex; flex-direction: column; gap: 14px; }

        @media (max-width: 768px) {
            .container { padding: 12px; }
            .card { padding: 16px; }
            .tab-btn { padding: 12px 10px; font-size: 14px; }
            .align-table th, .align-table td { padding: 10px 6px; font-size: 13px; }
            .th-color, .cell-color { padding-left: 8px !important; }
            .merged-text { font-size: 13px; }
            .merged-sub { display: block; margin-left: 0; font-size: 12px; }
            .qty-bold { font-size: 15px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-tabs">
        <button type="button" id="tabOrdersBtn" class="tab-btn active" onclick="switchPage('orders')">📋 訂單分板作業</button>
        <button type="button" id="tabCatalogBtn" class="tab-btn" onclick="switchPage('catalog')">🎨 色號對照表</button>
    </div>

    <div id="pageOrders">
        <div id="viewOrders">
            <div class="card">
                <div class="header-bar">
                    <h2>訂單管理</h2>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button type="button" onclick="openOrderModal()" class="btn btn-primary">➕ 新建訂單</button>
                        <button type="button" onclick="openWidthModal()" class="btn btn-setting">⚙️ 機台欄寬</button>
                        <button type="button" onclick="exportAllCSV()" class="btn btn-export">匯出全部總表</button>
                    </div>
                </div>
                <p style="color:#64748b; font-size:14px; margin:0;">
                    目前欄寬（色號 / Nesting / 電子鋸 / 操作）：<strong id="widthSummaryText" style="color:#1e3a8a;">30% / 28% / 28% / 14%</strong>
                </p>
            </div>
            <div class="card">
                <div class="header-bar"><h2>已建立的訂單列表</h2></div>
                <div id="orderListGrid" class="order-grid"></div>
            </div>
        </div>

        <div id="viewDetail" style="display: none;">
            <div class="card">
                <div class="header-bar">
                    <div>
                        <button type="button" onclick="goBack()" class="btn btn-back" style="height: 38px; padding: 6px 14px; font-size: 14px;">返回列表</button>
                        <span id="currentOrderTitle" style="font-size: 15px; font-weight: bold; margin-left: 10px; color: #1e3a8a;"></span>
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button type="button" onclick="openItemModal()" class="btn btn-primary" style="height: 38px; padding: 6px 14px; font-size: 14px;">➕ 加入色號</button>
                        <button
