<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排查版</title>
    <style>
        body { font-family: sans-serif; padding: 16px; background: #eef2f6; }
        .btn { padding: 12px 18px; font-size: 16px; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; margin: 6px 6px 6px 0; }
        #box { margin-top: 14px; padding: 14px; background: #fff; border-radius: 10px; }
    </style>
</head>
<body>
    <button type="button" class="btn" onclick="runTest('按鈕1')">測試按鈕 1</button>
    <button type="button" id="btn2" class="btn">測試按鈕 2</button>
    <div id="box">還沒按過</div>

    <script>
        function runTest(name) {
            document.getElementById('box').textContent = '有按到：' + name + '（' + new Date().toLocaleTimeString() + '）';
        }
        document.getElementById('btn2').addEventListener('click', function() {
            runTest('按鈕 2');
        });
    </script>
</body>
</html>
