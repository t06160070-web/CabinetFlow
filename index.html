<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { margin: 0; padding: 14px 12px; background: #eef2f6; color: #1f2937; }
        .wrap { max-width: 1050px; margin: 0 auto; }
        .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 14px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

        button { touch-action: manipulation; }

        /* 主按鈕與常用按鈕 */
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; background: #2563eb; }
        .btn-gray { background: #475569; }
        .btn-green { background: #059669; }
        .btn-purple { background: #7c3aed; }
        .btn-red { background: #ef4444; padding: 6px 10px; font-size: 13px; }

        /* 低調次要工具按鈕（欄寬、匯出、修改單據） */
        .btn-sub {
            padding: 7px 11px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #475569;
            background: #f8fafc;
        }
        .btn-sub:hover { background: #e2e8f0; color: #1e293b; }
        .btn-back-compact { padding: 7px 12px; font-size: 14px; }

        /* 頂部操作區排版 */
        .header-stack { display: flex; flex-direction: column; gap: 10px; }
        .header-row-main { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .header-row-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .detail-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
        .detail-title-text { font-size: 15px; font-weight: bold; color: #1e3a8a; line-height: 1.35; word-break: break-word; }

        @media (max-width: 600px) {
            .btn-primary-mobile { width: 100%; padding: 11px 16px; font-size: 15px; }
            .tools-pair-mobile { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .tools-pair-mobile .btn-sub { width: 100%; text-align: center; }
        }

        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; }
        .tab.active { background: #1e3a8a; color: #fff; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
        .order-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; cursor: pointer; position: relative; }
        .order-box:hover { border-color: #2563eb; background: #eff6ff; }
        .order-del-btn { position: absolute; top: 10px; right: 10px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 11px 6px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 15px; vertical-align: middle; word-break: break-word; }
        th.col-color, td.col-color { text-align: left; padding-left: 12px; }
        th.th-m1 { background: #dbeafe; color: #1e40af; }
        th.th-loc { background: #f1f5f9; color: #334155; }
        th.th-m2 { background: #fef3c7; color: #92400e; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; }

        .color-edit-cell { cursor: pointer; transition: background 0.15s; }
        .color-edit-cell:hover { background: #eff6ff; }
        .loc-badge { display: inline-block; background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; font-weight: bold; font-size: 13px; padding: 3px 8px; border-radius: 6px; }

        .prep-cell { cursor: pointer; user-select: none; transition: background 0.15s, color 0.15s; }
        .prep-cell:hover { filter: brightness(0.96); }
        .prep-done { background: #e2e8f0 !important; color: #94a3b8 !important; }
        .prep-done strong { color: #94a3b8; text-decoration: line-through; }

        .code-line { display: block; font-size: 14px; font-weight: bold; color: #111827; line-height: 1.3; }
        .wood-subline { display: block; font-size: 11.5px; font-weight: normal; color: #64748b; line-height: 1.35; margin-top: 2px; }

        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; padding: 16px; z-index: 999; }
        .modal-card { background: #fff; width: 100%; max-width: 440px; padding: 20px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; flex: 1; position: relative; }
        label { font-size: 13px; font-weight: bold; color: #475569; }
        input, textarea { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; background: #fff; }
        .row2 { display: flex; gap: 10px; }

        .type-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 30; box-shadow: 0 6px 14px rgba(0,0,0,0.12); }
        .type-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
        .type-item:hover { background: #eff6ff; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="tabs">
        <button type="button" id="tabOrders" class="tab active">📋 訂單分板</button>
        <button type="button" id="tabCatalog" class="tab">🎨 色號對照表</button>
    </div>

    <div id="secOrders">
        <div id="listView">
            <div class="card header-stack">
                <div class="header-row-main">
                    <h2 style="margin:0; font-size:19px;">訂單分板管理</h2>
                    <button type="button" id="btnNewOrder" class="btn btn-primary-mobile">➕ 新建訂單</button>
                </div>
                <div class="header-row-tools tools-pair-mobile">
                    <button type="button" id="btnWidthList" class="btn-sub">⚙️ 機台欄寬</button>
                    <button type="button" id="btnExportAll" class="btn-sub">📤 匯出全部 CSV</button>
                </div>
            </div>
            <div class="card">
                <div id="orderList" class="order-grid"></div>
            </div>
        </div>

        <div id="detailView" style="display:none;">
            <div class="card header-stack">
                <div class="header-row-main">
                    <div class="detail-meta">
                        <button type="button" id="btnBack" class="btn btn-gray btn-back-compact">← 返回</button>
                        <span id="detailTitle" class="detail-title-text"></span>
                    </div>
                    <button type="button" id="btnEditOrder" class="btn-sub">✏️ 修改單據</button>
                </div>
                <div class="header-row-main">
                    <button type="button" id="btnAddItem" class="btn btn-primary-mobile">➕ 加入色號</button>
                    <div class="header-row-tools tools-pair-mobile">
                        <button type="button" id="btnWidthDetail" class="btn-sub">⚙️ 機台欄寬</button>
                        <button type="button" id="btnExportOne" class="btn-sub">📤 匯出此單</button>
                    </div>
                </div>
            </div>
            <div class="card" style="padding:0; overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th id="thColor" class="col-color" style="width:32%;">色號 / 木名</th>
                            <th id="thM1" class="th-m1" style="width:24%;">Nesting 數量</th>
                            <th id="thLoc" class="th-loc" style="width:20%;">儲位</th>
                            <th id="thM2" class="th-m2" style="width:24%;">電子鋸 數量</th>
                        </tr>
                    </thead>
                    <tbody id="detailBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="secCatalog" style="display:none;">
        <div class="card">
            <div class="top-bar" style="margin-bottom:12px;">
                <h3 style="margin:0;">新增 / 修改 色號對照</h3>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <button type="button" id="btnNewCatList" class="btn-sub" style="color:#059669; border-color:#a7f3d0; background:#ecfdf5;">➕ 批次清單</button>
                    <button type="button" id="btnExportCat" class="btn-sub">📤 匯出對照</button>
                </div>
            </div>
            <div class="row2" style="flex-wrap:wrap;">
                <div class="field"><label>色號 *</label><input type="text" id="catCode" autocomplete="off" placeholder="例: H3303"></div>
                <div class="field"><label>木名 *</label><input type="text" id="catWood" autocomplete="off" placeholder="例: 漢密爾頓橡木"></div>
                <div class="field"><label>儲位</label><input type="text" id="catLoc" autocomplete="off" placeholder="例: A01"></div>
                <div style="display:flex; align-items:flex-end; margin-bottom:12px;">
                    <button type="button" id="btnSaveCat" class="btn">儲存</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="top-bar" style="margin-bottom:12px;">
                <h3 style="margin:0;">已建檔色號（<span id="catCount">0</span>）</h3>
                <input type="text" id="catSearch" autocomplete="off" placeholder="搜尋色號、木名或儲位..." style="max-width:220px;">
            </div>
            <table>
                <thead>
                    <tr>
                        <th class="col-color" style="width:26%;">色號</th>
                        <th class="col-color" style="width:36%;">木名</th>
                        <th style="width:20%;">儲位</th>
                        <th style="width:18%;">操作</th>
                    </tr>
                </thead>
                <tbody id="catBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 彈窗1：新建訂單 -->
<div id="orderModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">建立新訂單</h3>
        <div class="field">
            <label>訂單號 *</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="inOrderId" autocomplete="off" placeholder="輸入或掃描單號">
                <button type="button" id="btnOpenCam" class="btn btn-purple" style="white-space:nowrap;">📷 掃描</button>
            </div>
        </div>
        <div class="field"><label>案名</label><input type="text" id="inProject" autocomplete="off"></div>
        <div class="field"><label>出貨日期</label><input type="date" id="inDate" autocomplete="off"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" id="btnCancelOrder" class="btn btn-gray">取消</button>
            <button type="button" id="btnConfirmOrder" class="btn">確定建立</button>
        </div>
    </div>
</div>

<!-- 彈窗2：加入 / 修改 色號 -->
<div id="itemModal" class="modal-bg">
    <div class="modal-card">
        <h3 id="itemModalTitle" style="margin-top:0;">加入板材色號</h3>
        <div class="field">
            <label>色號 *</label>
            <input type="text" id="inCode" autocomplete="off" placeholder="打字搜尋預設 / 已建檔色號...">
            <div id="typeColorList" class="type-list"></div>
        </div>
        <div class="row2">
            <div class="field" style="flex:2;"><label>木名 *</label><input type="text" id="inWood" autocomplete="off" placeholder="例: 漢密爾頓橡木"></div>
            <div class="field" style="flex:1;"><label>儲位</label><input type="text" id="inLoc" autocomplete="off" placeholder="例: A01"></div>
        </div>
        <div class="row2">
            <div class="field"><label>Nesting 數</label><input type="number" id="inN" min="0" inputmode="numeric" autocomplete="off"></div>
            <div class="field"><label>電子鋸 數</label><input type="number" id="inS" min="0" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div style="display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:14px;">
            <button type="button" id="btnDeleteItem" class="btn btn-red" style="display:none; padding:10px 14px; font-size:14px;">🗑️ 刪除此筆</button>
            <div style="display:flex; gap:10px; margin-left:auto;">
                <button type="button" id="btnCancelItem" class="btn btn-gray">取消</button>
                <button type="button" id="btnConfirmItem" class="btn">確認儲存</button>
            </div>
        </div>
    </div>
</div>

<!-- 彈窗3：機台欄寬微調 -->
<div id="widthModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">微調欄位寬度 (%)</h3>
        <div class="row2">
            <div class="field"><label>色號/木名 (%)</label><input type="number" id="wColor" min="15" max="60" inputmode="numeric" autocomplete="off"></div>
            <div class="field"><label>儲位 (%)</label><input type="number" id="wLoc" min="8" max="40" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div class="row2">
            <div class="field"><label>Nesting (%)</label><input type="number" id="wM1" min="10" max="60" inputmode="numeric" autocomplete="off"></div>
            <div class="field"><label>電子鋸 (%)</label><input type="number" id="wM2" min="10" max="60" inputmode="numeric" autocomplete="off"></div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" id="btnCancelWidth" class="btn btn-gray">取消</button>
            <button type="button" id="btnConfirmWidth" class="btn">套用</button>
        </div>
    </div>
</div>

<!-- 彈窗4：相機掃描 -->
<div id="camModal" class="modal-bg" style="z-index:1100;">
    <div class="modal-card" style="text-align:center;">
        <h3 style="margin-top:0;">掃描訂單 QR Code</h3>
        <video id="camVideo" autoplay playsinline style="width:100%; height:220px; background:#000; border-radius:8px; object-fit:cover;"></video>
        <canvas id="camCanvas" style="display:none;"></canvas>
        <p id="camStatus" style="font-size:13px; color:#64748b;">準備開啟鏡頭...</p>
        <button type="button" id="btnCloseCam" class="btn btn-gray" style="width:100%;">關閉相機</button>
    </div>
</div>

<!-- 彈窗5：新建清單 -->
<div id="catalogListModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">新建色號清單</h3>
        <div class="field">
            <label>每行一筆（格式：色號 木名 [儲位]，用空白或逗號分隔）</label>
            <textarea id="modalCatList" rows="6" placeholder="H3303 漢密爾頓橡木 A01&#10;701 雪白 B02"></textarea>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" id="btnCancelCatList" class="btn btn-gray">取消</button>
            <button type="button" id="btnConfirmCatList" class="btn btn-green">⚡ 匯入對照</button>
        </div>
    </div>
</div>

<!-- 彈窗6：修改單據 -->
<div id="editOrderModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">修改訂單資訊</h3>
        <div class="field"><label>訂單號</label><input type="text" id="editOrderId" disabled style="background:#f1f5f9;"></div>
        <div class="field"><label>案名</label><input type="text" id="editProject" autocomplete="off"></div>
        <div class="field"><label>出貨日期</label><input type="date" id="editDate" autocomplete="off"></div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
            <button type="button" id="btnCancelEditOrder" class="btn btn-gray">取消</button>
            <button type="button" id="btnConfirmEditOrder" class="btn">儲存修改</button>
        </div>
    </div>
</div>

<script>
const DEFAULT_CATALOG = {
    'H3303': { wood: '漢密爾頓橡木', loc: 'A01' },
    '701': { wood: '雪白', loc: 'A02' },
    'U999': { wood: '炭黑', loc: 'B01' },
    'H1145': { wood: '巴登白橡', loc: 'B02' },
    'W1000': { wood: '尊貴白', loc: 'C01' }
};

function normalizeCatalog(raw) {
    const out = {};
    if (!raw || typeof raw !== 'object') return out;
    Object.entries(raw).forEach(([c, v]) => {
        if (typeof v === 'string') {
            out[c] = { wood: v, loc: '' };
        } else if (v && typeof v === 'object') {
            out[c] = { wood: v.wood || '', loc: v.loc || '' };
        }
    });
    return out;
}

let db = {};
let catalog = normalizeCatalog(DEFAULT_CATALOG);
let widths = { color: 32, m1: 24, loc: 20, m2: 24 };
let curId = null;
let editItemIdx = null;
let camStream = null;
let camActive = false;

try {
    const sDb = localStorage.getItem('boardSystemDB_v5');
    if (sDb) db = JSON.parse(sDb);
} catch (e) {}

try {
    const sCat = localStorage.getItem('boardSystemCatalog_v5');
    if (sCat) {
        const parsed = normalizeCatalog(JSON.parse(sCat));
        if (Object.keys(parsed).length > 0) catalog = parsed;
    }
} catch (e) {}

try {
    const sW = localStorage.getItem('boardSystemWidths_v6');
    if (sW) widths = Object.assign(widths, JSON.parse(sW));
} catch (e) {}

function saveAll() {
    try {
        localStorage.setItem('boardSystemDB_v5', JSON.stringify(db));
        localStorage.setItem('boardSystemCatalog_v5', JSON.stringify(catalog));
        localStorage.setItem('boardSystemWidths_v6', JSON.stringify(widths));
    } catch (e) {}
}

function applyWidths() {
    document.getElementById('thColor').style.width = widths.color + '%';
    document.getElementById('thM1').style.width = widths.m1 + '%';
    document.getElementById('thLoc').style.width = widths.loc + '%';
    document.getElementById('thM2').style.width = widths.m2 + '%';
}

function switchTab(tab) {
    document.getElementById('secOrders').style.display = tab === 'orders' ? 'block' : 'none';
    document.getElementById('secCatalog').style.display = tab === 'catalog' ? 'block' : 'none';
    document.getElementById('tabOrders').classList.toggle('active', tab === 'orders');
    document.getElementById('tabCatalog').classList.toggle('active', tab === 'catalog');
    if (tab === 'catalog') renderCatalog();
    if (tab === 'orders' && !curId) renderOrders();
}

function renderOrders() {
    const wrap = document.getElementById('orderList');
    const keys = Object.keys(db).reverse();
    if (!keys.length) {
        wrap.innerHTML = '<div style="color:#64748b;">尚無訂單，點上方「➕ 新建訂單」開始。</div>';
        return;
    }
    wrap.innerHTML = '';
    keys.forEach(id => {
        const o = db[id] || { items: [] };
        const nSum = (o.items || []).reduce((a, b) => a + (Number(b.n) || 0), 0);
        const sSum = (o.items || []).reduce((a, b) => a + (Number(b.s) || 0), 0);

        const box = document.createElement('div');
        box.className = 'order-box';
        box.onclick = () => openDetail(id);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'order-del-btn';
        delBtn.textContent = '刪除';
        delBtn.onclick = (ev) => {
            ev.stopPropagation();
            if (!confirm('確定要刪除訂單「' + id + '」嗎？')) return;
            delete db[id];
            saveAll();
            if (curId === id) backToList();
            else renderOrders();
        };

        const h3 = document.createElement('h3');
        h3.style.cssText = 'margin:0 0 6px 0; color:#1e3a8a; padding-right:42px;';
        h3.textContent = id;

        const info = document.createElement('div');
        info.style.cssText = 'font-size:13px; color:#475569;';
        info.innerHTML = '案名：' + (o.project || '未填') + '｜出貨日期：' + (o.date || '未定') + '<br>Nesting：<strong>' + nSum + '</strong>｜電子鋸：<strong>' + sSum + '</strong>';

        box.appendChild(delBtn);
        box.appendChild(h3);
        box.appendChild(info);
        wrap.appendChild(box);
    });
}

function openDetail(id) {
    if (!db[id]) return;
    curId = id;
    const o = db[id];
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('detailTitle').textContent = '[' + id + '] ' + (o.project || '未命名') + '｜出貨：' + (o.date || '未定');
    renderDetail();
}

function backToList() {
    curId = null;
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    renderOrders();
}

function getItemLoc(it) {
    if (catalog[it.code] && catalog[it.code].loc) return catalog[it.code].loc;
    return it.loc || '';
}

function renderDetail() {
    const tbody = document.getElementById('detailBody');
    const items = (db[curId] && db[curId].items) || [];
    let nSum = 0, sSum = 0;
    tbody.innerHTML = '';

    items.forEach((it, idx) => {
        const nVal = Number(it.n) || 0;
        const sVal = Number(it.s) || 0;
        const locVal = getItemLoc(it);
        nSum += nVal;
        sSum += sVal;
        const tr = document.createElement('tr');

        const tdColor = document.createElement('td');
        tdColor.className = 'col-color color-edit-cell';
        tdColor.title = '點選修改或刪除此色號';
        tdColor.innerHTML = '<span class="code-line">' + it.code + '</span><span class="wood-subline">' + it.wood + '</span>';
        tdColor.onclick = () => openEditItemModal(idx);

        const tdN = document.createElement('td');
        tdN.innerHTML = '<strong>' + (nVal || '-') + '</strong>';
        if (nVal > 0) {
            tdN.className = 'prep-cell' + (it.nDone ? ' prep-done' : '');
            tdN.onclick = () => {
                it.nDone = !it.nDone;
                saveAll();
                renderDetail();
            };
        }

        const tdLoc = document.createElement('td');
        tdLoc.innerHTML = locVal ? '<span class="loc-badge">' + locVal + '</span>' : '<span style="color:#94a3b8;">-</span>';

        const tdS = document.createElement('td');
        tdS.innerHTML = '<strong>' + (sVal || '-') + '</strong>';
        if (sVal > 0) {
            tdS.className = 'prep-cell' + (it.sDone ? ' prep-done' : '');
            tdS.onclick = () => {
                it.sDone = !it.sDone;
                saveAll();
                renderDetail();
            };
        }

        tr.appendChild(tdColor);
        tr.appendChild(tdN);
        tr.appendChild(tdLoc);
        tr.appendChild(tdS);
        tbody.appendChild(tr);
    });

    const sumTr = document.createElement('tr');
    sumTr.className = 'sum-row';
    sumTr.innerHTML = '<td class="col-color">合計</td><td>' + nSum + ' 片</td><td></td><td>' + sSum + ' 片</td>';
    tbody.appendChild(sumTr);
}

function openOrderModal() {

    document.getElementById('inProject').value = '';
    document.getElementById('inDate').value = '';
    document.getElementById('orderModal').style.display = 'flex';
    document.getElementById('inOrderId').focus();
}

function closeOrderModal() {

    document.getElementById('orderModal').style.display = 'none';
}

function confirmOrder() {
    const id = document.getElementById('inOrderId').value.trim();
    if (!id) return alert('請輸入訂單號');
    if (!db[id]) {
        db[id] = {
            project: document.getElementById('inProject').value.trim(),
            date: document.getElementById('inDate').value,

        };
    } else {

function openEditOrderModal() {

    document.getElementById('editProject').value = db[curId].project || '';
    document.getElementById('editDate').value = db[curId].date || '';

}

function closeEditOrderModal() {

function confirmEditOrder() {

function openItemModal() {
    editItemIdx = null;
    document.getElementById('itemModalTitle').textContent = '加入板材色號';
    document.getElementById('btnDeleteItem').style.display = 'none';
    document.getElementById('inCode').value = '';
    document.getElementById('inWood').value = '';
    document.getElementById('inLoc').value = '';
    document.getElementById('inN').value = '';
    document.getElementById('inS').value = '';
    document.getElementById('typeColorList').style.display = 'none';
    document.getElementById('itemModal').style.display = 'flex';
    document.getElementById('inCode').focus();
}

function openEditItemModal(idx) {
    const it = db[curId] && db[curId].items && db[curId].items[idx];
    if (!it) return;
    editItemIdx = idx;
    document.getElementById('itemModalTitle').textContent = '修改板材色號與數量';

    document.getElementById('inWood').value = it.wood;

    document.getElementById('inS').value = it.s || '';
    document.getElementById('typeColorList').style.display = 'none';
    document.getElementById('itemModal').style.display = 'flex';
    document.getElementById('inN').focus();
}

function deleteCurrentItem() {
    if (editItemIdx === null || !curId || !db[curId]) return;
    const it = db[curId].items[editItemIdx];
    if (!it) return;
    if (!confirm('確定要刪除「' + it.code + ' ' + it.wood + '」嗎？')) return;
    db[curId].items.splice(editItemIdx, 1);
    saveAll();
    renderDetail();
    closeItemModal();
}

function closeItemModal() {
    editItemIdx = null;
    document.getElementById('typeColorList').style.display = 'none';
    document.getElementById('itemModal').style.display = 'none';
}

function onTypeColor() {
    const rawVal = document.getElementById('inCode').value.trim();
    const kw = rawVal.toLowerCase();
    const box = document.getElementById('typeColorList');

    if (catalog[rawVal]) {
        document.getElementById('inWood').value = catalog[rawVal].wood || '';
        document.getElementById('inLoc').value = catalog[rawVal].loc || '';
    }

    if (!kw) {
        box.style.display = 'none';
        return;
    }
    const matches = Object.entries(catalog).filter(([c, info]) =>
        c.toLowerCase().includes(kw) ||
        (info.wood || '').toLowerCase().includes(kw) ||
        (info.loc || '').toLowerCase().includes(kw)
    );
    if (!matches.length) {
        box.style.display = 'none';
        return;
    }
    box.innerHTML = '';
    matches.forEach(([c, info]) => {
        const div = document.createElement('div');
        div.className = 'type-item';
        const locTag = info.loc ? '<span class="loc-badge" style="font-size:11px; padding:1px 6px;">' + info.loc + '</span>' : '';
        div.innerHTML = '<div><strong>' + c + '</strong> <span style="color:#64748b;">' + (info.wood || '') + '</span></div>' + locTag;
        div.onclick = () => {
            document.getElementById('inCode').value = c;
            document.getElementById('inWood').value = info.wood || '';
            document.getElementById('inLoc').value = info.loc || '';
            box.style.display = 'none';
            const inN = document.getElementById('inN');
            inN.focus();
            if (inN.select) inN.select();
        };
        box.appendChild(div);
    });
    box.style.display = 'block';
}

function confirmItem() {
    if (!curId) return;
    const code = document.getElementById('inCode').value.trim();
    const wood = document.getElementById('inWood').value.trim();
    const loc = document.getElementById('inLoc').value.trim();
    const n = Number(document.getElementById('inN').value) || 0;
    const s = Number(document.getElementById('inS').value) || 0;
    if (!code || !wood || (n === 0 && s === 0)) return alert('請填色號、木名與至少一邊數量');

    const prevCat = catalog[code] || {};
    catalog[code] = { wood, loc: loc || prevCat.loc || '' };

    if (editItemIdx !== null && db[curId].items[editItemIdx]) {
        const old = db[curId].items[editItemIdx];
        db[curId].items[editItemIdx] = {
            code,
            wood,
            loc: catalog[code].loc,
            n,
            s,
            nDone: n > 0 ? Boolean(old.nDone) : false,
            sDone: s > 0 ? Boolean(old.sDone) : false
        };
    } else {
        db[curId].items.push({ code, wood, loc: catalog[code].loc, n, s, nDone: false, sDone: false });
    }
    saveAll();
    renderDetail();
    closeItemModal();
}

    document.getElementById('wColor').value = widths.color;
    document.getElementById('wM1').value = widths.m1;
    document.getElementById('wLoc').value = widths.loc;
    document.getElementById('wM2').value = widths.m2;

        m1: Number(document.getElementById('wM1').value) || 24,

function openCatalogListModal() {
    document.getElementById('modalCatList').value = '';
    document.getElementById('catalogListModal').style.display = 'flex';
    document.getElementById('modalCatList').focus();
}

function closeCatalogListModal() {
    document.getElementById('catalogListModal').style.display = 'none';
}

function confirmCatalogList() {
    const lines = document.getElementById('modalCatList').value.trim().split(/\r?\n/);
    let n = 0;
    lines.forEach(line => {
        const parts = line.trim().split(/[\t,，\s]+/).filter(Boolean);
        if (parts.length >= 2) {
            const code = parts[0].trim();
            const wood = parts[1].trim();
            const loc = parts.slice(2).join(' ').trim();
            const old = catalog[code] || {};
            catalog[code] = { wood, loc: loc || old.loc || '' };
            n++;
        }
    });
    if (!n) return alert('沒有可匯入的資料');
    saveAll();
    closeCatalogListModal();
    renderCatalog();
    alert('已匯入 ' + n + ' 筆');
}

function saveCatalogItem() {
    const c = document.getElementById('catCode').value.trim();
    const w = document.getElementById('catWood').value.trim();
    const l = document.getElementById('catLoc').value.trim();
    if (!c || !w) return alert('請填寫色號與木名');
    catalog[c] = { wood: w, loc: l };
    saveAll();
    document.getElementById('catCode').value = '';
    document.getElementById('catWood').value = '';
    document.getElementById('catLoc').value = '';
    renderCatalog();
}

function renderCatalog() {
    const kw = (document.getElementById('catSearch').value || '').trim().toLowerCase();
    const allKeys = Object.keys(catalog);
    const entries = Object.entries(catalog).filter(([c, info]) =>
        !kw ||
        c.toLowerCase().includes(kw) ||
        (info.wood || '').toLowerCase().includes(kw) ||
        (info.loc || '').toLowerCase().includes(kw)
    );

    document.getElementById('catCount').textContent = kw ? (entries.length + ' / ' + allKeys.length) : entries.length;
    const tbody = document.getElementById('catBody');
    tbody.innerHTML = '';

    if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="color:#64748b; padding:18px;">找不到符合的色號</td></tr>';
        return;
    }

    entries.forEach(([c, info]) => {
        const tr = document.createElement('tr');

        const tdCode = document.createElement('td');
        tdCode.className = 'col-color';
        tdCode.style.cursor = 'pointer';
        tdCode.innerHTML = '<strong>' + c + '</strong>';
        tdCode.onclick = () => {
            document.getElementById('catCode').value = c;
            document.getElementById('catWood').value = info.wood || '';
            document.getElementById('catLoc').value = info.loc || '';
            document.getElementById('catLoc').focus();
        };

        const tdWood = document.createElement('td');
        tdWood.className = 'col-color';
        tdWood.textContent = info.wood || '';

        const tdLoc = document.createElement('td');
        tdLoc.innerHTML = info.loc ? '<span class="loc-badge">' + info.loc + '</span>' : '<span style="color:#94a3b8;">-</span>';

        const tdAct = document.createElement('td');
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-red';
        delBtn.textContent = '刪除';
        delBtn.onclick = () => {
            if (!confirm('確定要刪除色號「' + c + '」嗎？')) return;
            delete catalog[c];
            saveAll();
            renderCatalog();
        };
        tdAct.appendChild(delBtn);

        tr.appendChild(tdCode);
        tr.appendChild(tdWood);
        tr.appendChild(tdLoc);
        tr.appendChild(tdAct);
        tbody.appendChild(tr);
    });
}

function downloadCsv(filename, csvContent) {
    const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

function exportOneCsv() {
    if (!curId || !db[curId]) return alert('找不到訂單');
    const o = db[curId];
    const items = o.items || [];
    if (!items.length) return alert('此單尚無板材資料');
    let csv = '訂單號,案名,出貨日期,色號,木名,儲位,Nesting數量,電子鋸數量\n';
    items.forEach(it => {
        csv += '"' + curId + '","' + (o.project || '') + '","' + (o.date || '') + '","' + it.code + '","' + it.wood + '","' + getItemLoc(it) + '",' + (it.n || 0) + ',' + (it.s || 0) + '\n';
    });
    downloadCsv('訂單_' + curId + '.csv', csv);
}

function exportAllCsv() {
    const rows = [];
    Object.keys(db).forEach(id => {
        const o = db[id] || {};
        (o.items || []).forEach(it => {
            rows.push('"' + id + '","' + (o.project || '') + '","' + (o.date || '') + '","' + it.code + '","' + it.wood + '","' + getItemLoc(it) + '",' + (it.n || 0) + ',' + (it.s || 0));
        });
    });
    if (!rows.length) return alert('目前沒有可匯出的訂單明細');
    downloadCsv('全部訂單分板總表.csv', '訂單號,案名,出貨日期,色號,木名,儲位,Nesting數量,電子鋸數量\n' + rows.join('\n') + '\n');
}

function exportCatalogCsv() {
    const keys = Object.keys(catalog);
    if (!keys.length) return alert('目前沒有可匯出的色號對照');
    let csv = '色號,木名,儲位\n';
    keys.forEach(c => {
        const info = catalog[c] || {};
        csv += '"' + c + '","' + (info.wood || '') + '","' + (info.loc || '') + '"\n';
    });
    downloadCsv('色號對照表.csv', csv);
}

function closeCamModal() {
    camActive = false;
    if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
    }
    const vid = document.getElementById('camVideo');
    if (vid) vid.srcObject = null;
    document.getElementById('camModal').style.display = 'none';
}

async function openCamModal() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return alert('此瀏覽器不支援相機掃描，請直接輸入訂單號');
    }
    document.getElementById('camStatus').textContent = '正在啟動鏡頭...';
    document.getElementById('camModal').style.display = 'flex';
    camActive = true;
    try {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const vid = document.getElementById('camVideo');
        vid.srcObject = camStream;
        document.getElementById('camStatus').textContent = '請將 QR Code 對準鏡頭';
        if ('BarcodeDetector' in window) {
            const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39'] });
            const scanLoop = async () => {
                if (!camActive) return;
                try {
                    const codes = await detector.detect(vid);
                    if (codes && codes.length > 0 && codes[0].rawValue) {
                        document.getElementById('inOrderId').value = codes[0].rawValue.trim();
                        closeCamModal();
                        return;
                    }
                } catch (e) {}
                requestAnimationFrame(scanLoop);
            };
            requestAnimationFrame(scanLoop);
        } else {
            document.getElementById('camStatus').textContent = '目前瀏覽器無內建條碼偵測，請直接輸入單號';
        }
    } catch (err) {
        document.getElementById('camStatus').textContent = '無法開啟鏡頭或已拒絕權限';
    }
}
