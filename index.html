<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>分板系統 (基礎除錯版)</title>
    <style>
        body { font-family: sans-serif; background: #eef2f6; padding: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; background: #2563eb; color: #fff; border: none; border-radius: 6px; }
        input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🛠️ 系統按鈕測試區</h2>
    <p>如果點擊下方按鈕有跳出提示框，代表 JavaScript 執行完全正常！</p>
    <button class="btn" onclick="testClick()">點我測試按鈕有沒有反應</button>
</div>

<div class="card">
    <h2>📋 快速建立訂單測試</h2>
    <input type="text" id="orderInput" placeholder="輸入訂單號">
    <button class="btn" onclick="createOrderTest()">建立訂單</button>
    <p id="resultText" style="margin-top: 10px; font-weight: bold; color: #059669;"></p>
</div>

<script>
    console.log("JavaScript 載入成功！");

    function testClick() {
        alert("太棒了！按鈕有反應，JavaScript 正常運作中！");
    }

    function createOrderTest() {
        const val = document.getElementById('orderInput').value.trim();
        if (!val) {
            alert("請先輸入訂單號！");
            return;
        }
        document.getElementById('resultText').textContent = "成功建立訂單：" + val;
        document.getElementById('orderInput').value = "";
    }
</script>

</body>
</html>
