<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建訂單彈窗測試</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 24px; background: #eef2f6; }
        .btn { padding: 12px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; padding: 16px; }
        .modal-bg.show { display: flex; }
        .modal-box { background: #fff; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; }
        .field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
        input { padding: 10px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 8px; }
        #list { margin-top: 20px; display: grid; gap: 10px; }
        .item { background: #fff; padding: 14px; border-radius: 8px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <button type="button" class="btn" onclick="openModal()">➕ 新建訂單</button>
    <div id="list"></div>

    <div id="orderModal" class="modal-bg">
        <div class="modal-box">
            <h3 style="margin-top:0;">建立新訂單</h3>
            <form id="orderForm">
                <div class="field"><label>訂單號 *</label><input type="text" id="oid" required></div>
                <div class="field"><label>案名</label><input type="text" id="pname"></div>
                <div style="display:flex; gap:10px; justify-content:flex-end;">
                    <button type="button" class="btn" style="background:#64748b;" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn">確定</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let orders = JSON.parse(localStorage.getItem('testOrdersOnly')) || [];
        renderList();

        function openModal() {
            document.getElementById('orderModal').classList.add('show');
            document.getElementById('oid').focus();
        }
        function closeModal() {
            document.getElementById('orderModal').classList.remove('show');
            document.getElementById('orderForm').reset();
        }
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('oid').value.trim();
            const name = document.getElementById('pname').value.trim();
            if (!id) return;
            orders.unshift({ id, name });
            localStorage.setItem('testOrdersOnly', JSON.stringify(orders));
            renderList();
            closeModal();
        });
        function renderList() {
            document.getElementById('list').innerHTML = orders.map(o =>
                `<div class="item"><strong>${o.id}</strong> ｜ ${o.name || '未填寫'}</div>`
            ).join('');
        }
    </script>
</body>
</html>
