<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        body { margin: 0; padding: 20px; background: #eef2f6; color: #1f2937; }
        .wrap { max-width: 1050px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 18px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; background: #2563eb; }
        .btn-gray { background: #475569; }
        .btn-green { background: #059669; }
        .btn-red { background: #ef4444; padding: 6px 10px; font-size: 13px; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
        .order-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 16px; cursor: pointer; }
        .order-box:hover { border-color: #2563eb; background: #eff6ff; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 12px 8px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 15px; }
        th.col-color, td.col-color { text-align: left; padding-left: 12px; }
        th.th-m1 { background: #dbeafe; color: #1e40af; }
        th.th-m2 { background: #fef3c7; color: #92400e; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; }

        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; padding: 16px; z-index: 999; }
        .modal-card { background: #fff; width: 100%; max-width: 420px; padding: 20px; border-radius: 12px; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; flex: 1; }
        label { font-size: 13px; font-weight: bold; color: #475569; }
        input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; }
        .row2 { display: flex; gap: 10px; }
    </style>
</head>
<body>
<div class="wrap">
    <!-- 訂單列表畫面 -->
    <div id="listView">
        <div class="card top-bar">
            <h2 style="margin:0;">訂單分板管理</h2>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button type="button" class="btn" onclick="openOrderModal()">➕ 新建訂單</button>
                <button type="button" class="btn btn-gray" onclick="openWidthModal()">⚙️ 機台欄寬</button>
                <button type="button" class="btn btn-green" onclick="exportAll()">匯出全部 CSV</button>
            </div>
        </div>
        <div class="card">
            <div id="orderList" class="order-grid"></div>
        </div>
    </div>

    <!-- 訂單明細畫面 -->
    <div id="detailView" style="display:none;">
        <div class="card top-bar">
            <div>
                <button type="button" class="btn btn-gray" onclick="backToList()">← 返回</button>
                <strong id="detailTitle" style="margin-left:10px; font-size:16px; color:#1e3a8a;"></strong>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button type="button" class="btn" onclick="openItemModal()">➕ 加入色號</button>
                <button type="button" class="btn btn-gray" onclick="openWidthModal()">⚙️ 機台欄寬</button>
                <button type="button" class="btn btn-green" onclick="exportOne()">匯出此單 CSV</button>
            </div>
        </div>
        <div class="card" style="padding:0; overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th id="thColor" class="col-color" style="width:32%;">色號 / 木名</th>
                        <th id="thM1" class="th-m1" style="width:27%;">Nesting 數量</th>
                        <th id="thM2" class="th-m2" style="width:27%;">電子鋸 數量</th>
                        <th id="thAct" style="width:14%;">操作</th>
                    </tr>
                </thead>
                <tbody id="detailBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 彈窗1：新建訂單 -->
<div id="orderModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">建立新訂單</h3>
        <form onsubmit="submitOrder(event)">
            <div class="field"><label>訂單號 *</label><input type="text" id="inOrderId" required></div>
            <div class="field"><label>案名</label><input type="text" id="inProject"></div>
            <div class="field"><label>出貨日</label><input type="date" id="inDate"></div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn btn-gray" onclick="closeOrderModal()">取消</button>
                <button type="submit" class="btn">確定建立</button>
            </div>
        </form>
    </div>
</div>

<!-- 彈窗2：加入色號 -->
<div id="itemModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">加入板材色號</h3>
        <form onsubmit="submitItem(event)">
            <div class="field"><label>色號 *</label><input type="text" id="inCode" required></div>
            <div class="field"><label>木名 *</label><input type="text" id="inWood" required></div>
            <div class="row2">
                <div class="field"><label>Nesting 數</label><input type="number" id="inN" min="0"></div>
                <div class="field"><label>電子鋸 數</label><input type="number" id="inS" min="0"></div>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn btn-gray" onclick="closeItemModal()">取消</button>
                <button type="submit" class="btn">確認加入</button>
            </div>
        </form>
    </div>
</div>

<!-- 彈窗3：機台欄寬微調 -->
<div id="widthModal" class="modal-bg">
    <div class="modal-card">
        <h3 style="margin-top:0;">微調機台欄寬 (%)</h3>
        <form onsubmit="submitWidths(event)">
            <div class="row2">
                <div class="field"><label>色號/木名 (%)</label><input type="number" id="wColor" min="15" max="60" required></div>
                <div class="field"><label>操作欄 (%)</label><input type="number" id="wAct" min="8" max="30" required></div>
            </div>
            <div class="row2">
                <div class="field"><label>Nesting (%)</label><input type="number" id="wM1" min="10" max="60" required></div>
                <div class="field"><label>電子鋸 (%)</label><input type="number" id="wM2" min="10" max="60" required></div>
            </div>
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn btn-gray" onclick="closeWidthModal()">取消</button>
                <button type="submit" class="btn">套用</button>
            </div>
        </form>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('simpleBoardDB')) || {};
    let widths = JSON.parse(localStorage.getItem('simpleBoardWidths')) || { color: 32, m1: 27, m2: 27, act: 14 };
    let curId = null;

    applyWidths();
    renderOrders();

    function saveAll() {
        localStorage.setItem('simpleBoardDB', JSON.stringify(db));
        localStorage.setItem('simpleBoardWidths', JSON.stringify(widths));
    }

    function applyWidths() {
        document.getElementById('thColor').style.width = widths.color + '%';
        document.getElementById('thM1').style.width = widths.m1 + '%';
        document.getElementById('thM2').style.width = widths.m2 + '%';
        document.getElementById('thAct').style.width = widths.act + '%';
    }

    function openOrderModal() { document.getElementById('orderModal').style.display = 'flex'; document.getElementById('inOrderId').focus(); }
    function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; document.getElementById('inOrderId').value = ''; document.getElementById('inProject').value = ''; document.getElementById('inDate').value = ''; }

    function openItemModal() { document.getElementById('itemModal').style.display = 'flex'; document.getElementById('inCode').focus(); }
    function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; document.getElementById('inCode').value = ''; document.getElementById('inWood').value = ''; document.getElementById('inN').value = ''; document.getElementById('inS').value = ''; }

    function openWidthModal() {
        document.getElementById('wColor').value = widths.color;
        document.getElementById('wM1').value = widths.m1;
        document.getElementById('wM2').value = widths.m2;
        document.getElementById('wAct').value = widths.act;
        document.getElementById('widthModal').style.display = 'flex';
    }
    function closeWidthModal() { document.getElementById('widthModal').style.display = 'none'; }

    function submitWidths(e) {
        e.preventDefault();
        widths = {
            color: Number(document.getElementById('wColor').value) || 32,
            m1: Number(document.getElementById('wM1').value) || 27,
            m2: Number(document.getElementById('wM2').value) || 27,
            act: Number(document.getElementById('wAct').value) || 14
        };
        applyWidths();
        saveAll();
        closeWidthModal();
    }

    function submitOrder(e) {
        e.preventDefault();
        const id = document.getElementById('inOrderId').value.trim();
        if (!id) return;
        if (!db[id]) db[id] = { project: document.getElementById('inProject').value.trim(), date: document.getElementById('inDate').value, items: [] };
        saveAll();
        closeOrderModal();
        openDetail(id);
    }

    function submitItem(e) {
        e.preventDefault();
        if (!curId) return;
        const code = document.getElementById('inCode').value.trim();
        const wood = document.getElementById('inWood').value.trim();
        const n = Number(document.getElementById('inN').value) || 0;
        const s = Number(document.getElementById('inS').value) || 0;
        if (!code || !wood || (n === 0 && s === 0)) return alert('請填色號、木名與至少一邊數量');
        db[curId].items.push({ code, wood, n, s });
        saveAll();
        renderDetail();
        closeItemModal();
    }

    function openDetail(id) {
        curId = id;
        document.getElementById('listView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        document.getElementById('detailTitle').textContent = `[${id}] ${db[id].project || '未命名'}`;
        renderDetail();
    }

    function backToList() {
        curId = null;
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('listView').style.display = 'block';
        renderOrders();
    }

    function delItem(idx) {
        db[curId].items.splice(idx, 1);
        saveAll();
        renderDetail();
    }

    function renderOrders() {
        const keys = Object.keys(db).reverse();
        document.getElementById('orderList').innerHTML = keys.length ? keys.map(id => {
            const o = db[id];
            const nSum = (o.items || []).reduce((a, b) => a + b.n, 0);
            const sSum = (o.items || []).reduce((a, b) => a + b.s, 0);
            return `<div class="order-box" onclick="openDetail('${id.replace(/'/g, "\\'")}')">
                <h3 style="margin:0 0 6px 0; color:#1e3a8a;">${id}</h3>
                <div style="font-size:13px; color:#475569;">案名：${o.project || '未填'}｜出貨：${o.date || '未定'}<br>Nesting：<strong>${nSum}</strong>｜電子鋸：<strong>${sSum}</strong></div>
            </div>`;
        }).join('') : '<div style="color:#64748b;">尚無訂單，點上方「➕ 新建訂單」開始。</div>';
    }

    function renderDetail() {
        const items = (db[curId] && db[curId].items) || [];
        let nSum = 0, sSum = 0;
        document.getElementById('detailBody').innerHTML = items.map((it, i) => {
            nSum += it.n; sSum += it.s;
            return `<tr>
                <td class="col-color"><strong>${it.code}</strong> <span style="color:#475569;">${it.wood}</span></td>
                <td><strong>${it.n || '-'}</strong></td>
                <td><strong>${it.s || '-'}</strong></td>
                <td><button type="button" class="btn btn-red" onclick="delItem(${i})">刪除</button></td>
            </tr>`;
        }).join('') + `<tr class="sum-row"><td class="col-color">合計</td><td>${nSum} 片</td><td>${sSum} 片</td><td></td></tr>`;
    }

    function dl(csv, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = name;
        a.click();
    }

    function exportOne() {
        const o = db[curId];
        if (!o || !o.items.length) return alert('無資料');
        let csv = '\uFEFF訂單號,案名,出貨日,色號,木名,Nesting數量,電子鋸數量\n';
        o.items.forEach(i => csv += `"${curId}","${o.project || ''}","${o.date || ''}","${i.code}","${i.wood}",${i.n || ''},${i.s || ''}\n`);
        dl(csv, `訂單_${curId}.csv`);
    }

    function exportAll() {
        const keys = Object.keys(db);
        if (!keys.length) return alert('無資料');
        let csv = '\uFEFF訂單號,案名,出貨日,色號,木名,Nesting數量,電子鋸數量\n';
        keys.forEach(id => {
            const o = db[id];
            (o.items || []).forEach(i => csv += `"${id}","${o.project || ''}","${o.date || ''}","${i.code}","${i.wood}",${i.n || ''},${i.s || ''}\n`);
        });
        dl(csv, '全部訂單總表.csv');
    }
</script>
</body>
</html>
