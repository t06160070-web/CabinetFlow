<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點擊測試版</title>
    <style>
        body { margin: 0; padding: 16px; font-family: sans-serif; background: #eef2f6; }
        #dbg { padding: 8px 12px; margin-bottom: 12px; border-radius: 8px; background: #fee2e2; color: #991b1b; font-size: 13px; font-weight: bold; }
        .btn { padding: 12px 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; margin-right: 8px; }
        .btn-sub { background: #64748b; }
        .card { background: #fff; padding: 16px; border-radius: 12px; margin-top: 12px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-box { background: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 360px; }
    </style>
</head>
<body>
    <div id="dbg">等待 JS 啟動...</div>

    <button type="button" id="t1" class="btn">訂單分板</button>
    <button type="button" id="t2" class="btn btn-sub">色號對照表</button>
    <button type="button" id="bNew" class="btn">➕ 新建訂單</button>

    <div id="p1" class="card">目前在：訂單分板（點擊次數：<span id="cnt">0</span>）</div>
    <div id="p2" class="card" style="display:none;">目前在：色號對照表</div>

    <div id="m1" class="modal">
        <div class="modal-box">
            <h3>測試彈窗</h3>
            <p>彈窗有正常跳出來！</p>
            <button type="button" id="bClose" class="btn btn-sub">關閉</button>
        </div>
    </div>

    <script>
        const dbg = document.getElementById('dbg');
        window.onerror = function(msg, src, line) {
            dbg.textContent = 'JS 錯誤 (第 ' + line + ' 行)：' + msg;
        };

        let n = 0;
        document.getElementById('t1').onclick = function() {
            n++;
            document.getElementById('cnt').textContent = n;
            document.getElementById('p1').style.display = 'block';
            document.getElementById('p2').style.display = 'none';
            dbg.style.background = '#dcfce7';
            dbg.style.color = '#166534';
            dbg.textContent = '運作正常：切換到訂單分板';
        };

        document.getElementById('t2').onclick = function() {
            document.getElementById('p1').style.display = 'none';
            document.getElementById('p2').style.display = 'block';
            dbg.style.background = '#dcfce7';
            dbg.style.color = '#166534';
            dbg.textContent = '運作正常：切換到色號對照表';
        };

        document.getElementById('bNew').onclick = function() {
            document.getElementById('m1').style.display = 'flex';
        };

        document.getElementById('bClose').onclick = function() {
            document.getElementById('m1').style.display = 'none';
        };

        dbg.style.background = '#dcfce7';
        dbg.style.color = '#166534';
        dbg.textContent = 'JS 已啟動！請試著點上面的按鈕';
    </script>
</body>
</html>
