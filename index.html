<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; padding: 14px 12px; background: #eef2f6; color: #1f2937; }
        #errBar { display: none; padding: 8px 12px; margin-bottom: 12px; border-radius: 8px; background: #fee2e2; color: #991b1b; font-size: 13px; font-weight: bold; }
        .wrap { max-width: 1050px; margin: 0 auto; }
        .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 14px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

        button { touch-action: manipulation; }
        .btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; color: #fff; background: #2563eb; }
        .btn-gray { background: #475569; }
        .btn-green { background: #059669; }
        .btn-red { background: #ef4444; padding: 6px 10px; font-size: 13px; }

        .btn-sub {
            padding: 7px 11px; border: 1px solid #cbd5e1; border-radius: 7px;
            font-size: 13px; font-weight: 600; cursor: pointer; color: #475569; background: #f8fafc;
        }
        .btn-back-compact { padding: 7px 12px; font-size: 14px; }

        .header-stack { display: flex; flex-direction: column; gap: 10px; }
        .header-row-main { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
        .header-row-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .detail-top-bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .detail-left { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
        .detail-info-stack { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
        .detail-order-id { font-size: 18px; font-weight: 800; color: #1e3a8a; line-height: 1.25; word-break: break-word; }
        .detail-sub-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13.5px; color: #475569; line-height: 1.4; }
        .detail-project { font-weight: 600; color: #334155; word-break: break-word; }
        .detail-date { color: #64748b; }

        @media (max-width: 600px) {
            .btn-primary-mobile { width: 100%; padding: 11px 16px; font-size: 15px; }
            .tools-pair-mobile { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .tools-pair-mobile .btn-sub { width: 100%; text-align: center; }
        }

        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; }
        .tab.active { background: #1e3a8a; color: #fff; }

        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
        .order-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 14px; cursor: pointer; position: relative; }
        .order-del-btn { position: absolute; top: 10px; right: 10px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 11px 6px; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 15px; vertical-align: middle; word-break: break-word; }
        th.col-color, td.col-color { text-align: left; padding-left: 12px; }
        th.th-m1 { background: #dbeafe; color: #1e40af; }
        th.th-loc { background: #f1f5f9; color: #334155; }
        th.th-m2 { background: #fef3c7; color: #92400e; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; }

        .color-edit-cell { cursor: pointer; }
        .loc-badge { display: inline-block; background: #f1f5f9; border: 1px solid #cbd5e1; color: #334155; font-weight: bold; font-size: 13px; padding: 3px 8px; border-radius: 6px; }

        .prep-cell { cursor: pointer; user-select: none; }
        .prep-done { background: #e2e8f0; color: #94a3b8; }
        .prep-done strong { color: #94a3b8; text-decoration: line-through; }

        .code-line { display: block; font-size: 14px; font-weight: bold; color: #111827; line-height: 1.3; }
        .wood-subline { display: block; font-size: 11.5px; font-weight: normal; color: #64748b; line-height: 1.35; margin-top: 2px; }

        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; padding: 16px; z-index: 999; }
        .modal-card { background: #fff; width: 100%; max-width: 440px; padding: 20px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; flex: 1; position: relative; }
        label { font-size: 13px; font-weight: bold; color: #475569; }
        input, textarea { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; background: #fff; }
        .row2 { display: flex; gap: 10px; }

        .type-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 30; box-shadow: 0 6px 14px rgba(0,0,0,0.12); }
        .type-item { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
    </style>
</head>
<body>
<div class="wrap">
    <div id="errBar"></div>

    <div class="tabs">
        <button type="button" id="tabOrders" class="tab active">訂單分板</button>
        <button type="button" id="tabCatalog" class="tab">色號對照表</button>
    </div>

    <div id="secOrders">
        <div id="listView">
            <div class="card header-stack">
                <div class="header-row-main">
                    <h2 style="margin:0; font-size:19px;">訂單分板管理</h2>
                    <button type="button" id="btnNewOrder" class="btn btn-primary-mobile">+ 新建訂單</button>
                </div>
                <div class="header-row-tools tools-pair-mobile">
                    <button type="button" id="btnWidthList" class="btn-sub">機台欄寬</button>
                    <button type="button" id="btnExportAll" class="btn-sub">匯出全部 CSV</button>
                </div>
            </div>
            <div class="card">
                <div id="orderList" class="order-grid"></div>
            </div>
        </div>

        <div id="detailView" style="display:none;">
            <div class="card header-stack">
                <div class="detail-top-bar">
                    <div class="detail-left">
                        <button type="button" id="btnBack" class="btn btn-gray btn-back-compact">返回</button>
                        <div class="detail-info-stack">
                            <div id="detailOrderId" class="detail-order-id"></div>
                            <div class="detail-sub-meta">
