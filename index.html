<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃訂單分板系統 (極致穩定版)</title>
    <style>
        * { box-sizing: border-box; font-family: "Microsoft JhengHei", sans-serif; }
        html, body { overflow-x: hidden; max-width: 100vw; margin: 0; padding: 0; background: #eef2f6; color: #1f2937; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; }
        
        .nav-tabs { display: flex; gap: 12px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 14px 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #cbd5e1; color: #334155; text-align: center; }
        .tab-btn.active { background: #1e3a8a; color: #fff; box-shadow: 0 4px 12px rgba(30,58,138,0.25); }
        
        .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; width: 100%; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .header-bar h2 { margin: 0; font-size: 19px; color: #0f172a; }
        
        .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; width: 100%; }
        .field { display: flex; flex-direction: column; flex: 1; min-width: 160px; position: relative; }
        label { font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #475569; }
        input, textarea { padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; width: 100%; background: #fff; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        
        .btn { padding: 11px 20px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-back { background: #475569; color: #fff; }
        .btn-export { background: #059669; color: #fff; }
        .btn-scan { background: #7c3aed; color: #fff; }
        .btn-del { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 13px; height: 32px; border-radius: 6px; }
        
        .order-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; width: 100%; }
        .order-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 18px; cursor: pointer; position: relative; }
        .order-item:hover { border-color: #2563eb; background: #eff6ff; }
        .order-item h3 { margin: 0 0 6px 0; font-size: 18px; color: #1e3a8a; }
        .order-meta { font-size: 13px; color: #475569; line-height: 1.6; }
        .order-del-top { position: absolute; top: 14px; right: 14px; background: #fee2e2; color: #dc2626; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-weight: bold; font-size: 12px; }

        .autocomplete-dropdown { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,0.12); max-height: 220px; overflow-y: auto; z-index: 99; margin-top: 4px; }
        .autocomplete-item { padding: 11px 14px; font-size: 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
        .autocomplete-item:hover { background: #eff6ff; color: #1d4ed8; }

        .desktop-view { display: block; }
        table.align-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .align-table th, .align-table td { padding: 14px 12px; text-align: center; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        .th-nesting { background: #dbeafe; color: #1e40af; font-size: 16px; border-right: 2px solid #94a3b8; }
        .th-saw { background: #fef3c7; color: #92400e; font-size: 16px; }
        .sub-nesting { background: #eff6ff; color: #1e3a8a; font-size: 13px; }
        .sub-saw { background: #fffbeb; color: #78350f; font-size: 13px; }
        .divider { border-right: 2px solid #94a3b8 !important; }
        .cell-n { background: #f8fafc; }
        .cell-s { background: #fffdf7; }
        .merged-text { font-weight: bold; color: #111827; font-size: 15px; }
        .merged-sub { font-weight: normal; color: #4b5563; margin-left: 6px; }
        .qty-bold { font-weight: bold; font-size: 18px; color: #0f172a; }
        .sum-row td { background: #f1f5f9; font-weight: bold; border-top: 2px solid #cbd5e1; font-size: 15px; }

        .mobile-view { display: none; }
        .mobile-card-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 16px; margin-bottom: 14px; position: relative; }
        .mobile-card-header { font-size: 16px; font-weight: bold; color: #1e3a8a; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .mobile-sub-section { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; font-size: 14px; border-radius: 6px; margin-bottom: 6px; }
        .mobile-sum-box { background: #f1f5f9; padding: 14px; border-radius: 8px; font-weight: bold; margin-top: 15px; display: flex; justify-content: space-around; text-align: center; }

        table.catalog-table { width: 100%; border-collapse: collapse; }
        .catalog-table th, .catalog-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        .catalog-table th { background: #f8fafc; color: #334155; }

        @media (max-width: 768px) {
            .desktop-view { display: none !important; }
            .mobile-view { display: block !important; }
            .container { padding: 12px; }
            .card { padding: 16px; }
            .row button { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-tabs">
        <button id="tabOrdersBtn" class="tab-btn active" onclick="switchPage('orders')">📋 訂單分板作業</button>
        <button id="tabCatalogBtn" class="tab-btn" onclick="switchPage('catalog')">🎨 色號對照表</button>
    </div>
    
    <div id="pageOrders">
        <div id="viewOrders">
            <div class="card">
                <div class="header-bar"><h2>步驟 1：建立或選擇訂單</h2><button onclick="exportAllCSV()" class="btn btn-export">匯出全部總表</button></div>
                <form id="createOrderForm" class="row">
                    <div class="field"><label>新訂單號 *</label><input type="text" id="newOrderId" placeholder="輸入訂單號或用條碼槍刷入" required autocomplete="off"></div>
                    <div class="field"><label>案名</label><input type="text" id="newProjectName" placeholder="例: 王先生案" autocomplete="off"></div>
                    <div class="field" style="max-width: 160px;"><label>出貨日期</label><input type="date" id="newShipDate"></div>
                    <button type="submit" class="btn btn-primary">建立訂單</button>
                </form>
            </div>
            <div class="card">
                <div class="header-bar"><h2>已建立的訂單列表</h2></div>
                <div id="orderListGrid" class="order-grid"></div>
            </div>
        </div>
        
        <div id="viewDetail" style="display: none;">
            <div class="card">
                <div class="header-bar">
                    <div>
                        <button onclick="goBack()" class="btn btn-back" style="height: 38px; padding: 6px 14px; font-size: 14px;">返回列表</button>
                        <span id="currentOrderTitle" style="font-size: 15px; font-weight: bold; margin-left: 10px; color: #1e3a8a;"></span>
                    </div>
                    <button onclick="exportSingleCSV()" class="btn btn-export" style="height: 38px; padding: 6px 14px; font-size: 14px;">匯出此單 Excel</button>
                </div>
                <form id="addColorForm" class="row">
                    <div class="field">
                        <label>板材色號 *</label>
                        <input type="text" id="colorCode" placeholder="輸入色號或木名關鍵字..." autocomplete="off" required>
                        <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>
                    </div>
                    <div class="field"><label>木名 *</label><input type="text" id="woodName" placeholder="自動帶出" required autocomplete="off"></div>
                    <div class="field" style="max-width: 130px;"><label style="color:#1e40af;">Nesting 數</label><input type="number" id="nestingQty" min="0" placeholder="留空"></div>
                    <div class="field" style="max-width: 130px;"><label style="color:#b45309;">電子鋸 數</label><input type="number" id="sawQty" min="0" placeholder="留空"></div>
                    <button type="submit" class="btn btn-primary">加入色號</button>
                </form>
            </div>

            <!-- 🖥️ 電腦版：雙欄大表格 -->
            <div class="card desktop-view" style="padding: 0; overflow-x: auto;">
                <table class="align-table">
                    <thead>
                        <tr><th colspan="2" class="th-nesting">Nesting</th><th colspan="2" class="th-saw">電子鋸</th><th rowspan="2" style="width: 80px; background:#f1f5f9; font-size:13px;">操作</th></tr>
                        <tr><th class="sub-nesting" style="width: 32%;">色號 / 木名</th><th class="sub-nesting divider" style="width: 14%;">數量</th><th class="sub-saw" style="width: 32%;">色號 / 木名</th><th class="sub-saw" style="width: 14%;">數量</th></tr>
                    </thead>
                    <tbody id="detailTableBody"></tbody>
                </table>
            </div>

            <!-- 📱 手機版：卡片流模式 -->
            <div class="mobile-view">
                <div id="mobileCardContainer"></div>
            </div>
        </div>
    </div>

    <div id="pageCatalog" style="display: none;">
        <div class="card">
            <div class="header-bar"><h2>新增 / 修改 色號對照</h2></div>
            <form id="catalogForm" class="row">
                <div class="field" style="max-width: 200px;"><label>色號 *</label><input type="text" id="catCode" placeholder="例: H3303" required autocomplete="off"></div>
                <div class="field" style="max-width: 300px;"><label>木名 *</label><input type="text" id="catName" placeholder="例: 漢密爾頓橡木" required autocomplete="off"></div>
                <button type="submit" class="btn btn-primary">儲存對照</button>
            </form>
        </div>
        <div class="card">
            <div class="header-bar"><h2>📥 批次匯入對照表</h2></div>
            <p style="font-size:13px; color:#475569; margin-top:0;">每行一筆，用 <strong>Tab</strong>、<strong>空格</strong> 或 <strong>逗號</strong> 分隔。</p>
            <textarea id="batchInput" rows="4" style="width:100%;" placeholder="H3303 漢密爾頓橡木&#10;701 雪白"></textarea>
            <div style="margin-top: 12px; display:flex; justify-content:space-between;">
                <button type="button" onclick="batchImportCatalog()" class="btn btn-export">⚡ 執行批次匯入</button>
                <button type="button" onclick="clearCatalog()" class="btn btn-del" style="height: 46px; font-size: 14px;">清空全部</button>
            </div>
        </div>
        <div class="card">
            <div class="header-bar"><h2>已建檔色號（<span id="catalogCount">0</span> 筆）</h2><input type="text" id="searchCatalog" placeholder="搜尋色號或木名..." style="width: 220px; padding: 9px 12px;" autocomplete="off"></div>
            <table class="catalog-table">
                <thead><tr><th>色號</th><th>木名</th><th style="width: 120px;">操作</th></tr></thead>
                <tbody id="catalogTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let ordersDB = JSON.parse(localStorage.getItem('ordersMasterDBV3')) || {};
    let colorCatalog = JSON.parse(localStorage.getItem('colorCatalogDB')) || {};
    let currentOrder = null;

    renderOrderList();

    function switchPage(page) {
        document.getElementById('pageOrders').style.display = page === 'orders' ? 'block' : 'none';
        document.getElementById('pageCatalog').style.display = page === 'catalog' ? 'block' : 'none';
        document.getElementById('tabOrdersBtn').classList.toggle('active', page === 'orders');
        document.getElementById('tabCatalogBtn').classList.toggle('active', page === 'catalog');
        if (page === 'catalog') renderCatalogTable();
        if (page === 'orders' && !currentOrder) renderOrderList();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    document.getElementById('catalogForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const code = document.getElementById('catCode').value.trim();
        const name = document.getElementById('catName').value.trim();
        if (!code || !name) return;
        colorCatalog[code] = name; 
        saveCatalog();
        document.getElementById('catCode').value = ''; 
        document.getElementById('catName').value = '';
        document.getElementById('catCode').focus(); 
        renderCatalogTable();
    });

    function batchImportCatalog() {
        const text = document.getElementById('batchInput').value.trim();
        if (!text) return alert('請先貼上資料！');
        let count = 0;
        text.split(/\r?\n/).forEach(line => {
            const match = line.trim().match(/^([^\t,，\s]+)[\t,，\s]+(.+)$/);
            if (match && match[1].trim() && match[2].trim()) {
                colorCatalog[match[1].trim()] = match[2].trim();
                count++;
            }
        });
        if (count > 0) { saveCatalog(); renderCatalogTable(); document.getElementById('batchInput').value = ''; alert(`成功匯入 ${count} 筆！`); }
        else alert('格式無法辨識！');
    }

    function clearCatalog() { if (confirm('確定清空色號庫？')) { colorCatalog = {}; saveCatalog(); renderCatalogTable(); } }
    document.getElementById('searchCatalog').addEventListener('input', renderCatalogTable);
    function editCatalogItem(code) { document.getElementById('catCode').value = code; document.getElementById('catName').value = colorCatalog[code] || ''; document.getElementById('catName').focus(); }
    function deleteCatalogItem(code) { if (confirm(`刪除色號「${code}」？`)) { delete colorCatalog[code]; saveCatalog(); renderCatalogTable(); } }
    
    function saveCatalog() { 
        localStorage.setItem('colorCatalogDB', JSON.stringify(colorCatalog)); 
    }

    const colorInput = document.getElementById('colorCode');
    const woodInput = document.getElementById('woodName');
    const dropdown = document.getElementById('autocompleteDropdown');

    colorInput.addEventListener('input', function() {
        const keyword = this.value.trim().toLowerCase();
        const matchedKey = Object.keys(colorCatalog).find(k => k.toLowerCase() === keyword);
        if (matchedKey) {
            woodInput.value = colorCatalog[matchedKey];
        }

        if (!keyword) {
            dropdown.style.display = 'none';
            return;
        }

        const filtered = Object.entries(colorCatalog).filter(([c, n]) => 
            c.toLowerCase().includes(keyword) || n.toLowerCase().includes(keyword)
        );

        if (filtered.length > 0) {
            dropdown.innerHTML = filtered.map(([c, n]) => `
                <div class="autocomplete-item" onclick="selectDropdownItem('${escapeHtml(c)}', '${escapeHtml(n)}')">
                    <strong>${escapeHtml(c)}</strong>
                    <span style="color:#64748b;">${escapeHtml(n)}</span>
                </div>
            `).join('');
            dropdown.style.display = 'block';
        } else {
            dropdown.style.display = 'none';
        }
    });

    function selectDropdownItem(code, name) {
        colorInput.value = code;
        woodInput.value = name;
        dropdown.style.display = 'none';
        document.getElementById('nestingQty').focus();
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.field')) {
            dropdown.style.display = 'none';
        }
    });

    function renderCatalogTable() {
        const kw = document.getElementById('searchCatalog').value.trim().toLowerCase();
        const entries = Object.entries(colorCatalog).filter(([c, n]) => c.toLowerCase().includes(kw) || n.toLowerCase().includes(kw));
        document.getElementById('catalogCount').textContent = Object.keys(colorCatalog).length;
        document.getElementById('catalogTableBody').innerHTML = entries.length ? entries.map(([code, name]) => `
            <tr><td><strong>${escapeHtml(code)}</strong></td><td>${escapeHtml(name)}</td>
            <td><button class="btn" style="background:#3b82f6;color:#fff;padding:4px 8px;font-size:12px;height:32px;" onclick="editCatalogItem('${escapeHtml(code)}')">修改</button>
            <button class="btn-del" onclick="deleteCatalogItem('${escapeHtml(code)}')">刪除</button></td></tr>
        `).join('') : `<tr><td colspan="3" style="text-align:center;color:#9ca3af;padding:20px;">無符合資料</td></tr>`;
    }

    document.getElementById('createOrderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('newOrderId').value.trim();
        const projectName = document.getElementById('newProjectName').value.trim();
        const shipDate = document.getElementById('newShipDate').value;
        if (!id) return;

        if (!ordersDB[id]) { ordersDB[id] = { projectName, shipDate, items: [] }; }
        else { ordersDB[id].projectName = projectName; ordersDB[id].shipDate = shipDate; }
        saveOrders();
        document.getElementById('newOrderId').value = '';
        document.getElementById('newProjectName').value = '';
        document.getElementById('newShipDate').value = '';
        openOrder(id);
    });

    function openOrder(orderId) {
        currentOrder = orderId;
        const orderData = ordersDB[orderId];
        document.getElementById('viewOrders').style.display = 'none';
        document.getElementById('viewDetail').style.display = 'block';
        document.getElementById('currentOrderTitle').textContent = `[${orderId}] ${orderData.projectName || '未命名'} (出貨: ${orderData.shipDate || '未定'})`;
        renderDetailViews(); 
        colorInput.focus();
    }

    function goBack() { currentOrder = null; document.getElementById('viewDetail').style.display = 'none'; document.getElementById('viewOrders').style.display = 'block'; renderOrderList(); }

    document.getElementById('addColorForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const colorCode = colorInput.value.trim();
        const woodName = woodInput.value.trim();
        const nQty = parseInt(document.getElementById('nestingQty').value, 10) || 0;
        const sQty = parseInt(document.getElementById('sawQty').value, 10) || 0;
        
        if (nQty === 0 && sQty === 0) return alert('請至少輸入一邊的數量！');
        if (!colorCatalog[colorCode]) { colorCatalog[colorCode] = woodName; saveCatalog(); }
        
        let orderObj = ordersDB[currentOrder];
        if (!orderObj.items) orderObj.items = [];

        const existing = orderObj.items.find(i => i.colorCode === colorCode);
        if (existing) { existing.woodName = woodName; existing.nestingQty += nQty; existing.sawQty += sQty; }
        else { orderObj.items.push({ colorCode, woodName, nestingQty: nQty, sawQty: sQty }); }

        saveOrders(); 
        renderDetailViews();
        colorInput.value = ''; woodInput.value = '';
        document.getElementById('nestingQty').value = ''; document.getElementById('sawQty').value = '';
        colorInput.focus();
    });

    function deleteColorRow(idx) { ordersDB[currentOrder].items.splice(idx, 1); saveOrders(); renderDetailViews(); }
    function deleteOrder(e, id) { e.stopPropagation(); if (confirm(`刪除訂單「${id}」？`)) { delete ordersDB[id]; saveOrders(); renderOrderList(); } }
    function saveOrders() { localStorage.setItem('ordersMasterDBV3', JSON.stringify(ordersDB)); }

    function renderOrderList() {
        const grid = document.getElementById('orderListGrid');
        const keys = Object.keys(ordersDB).reverse();
        grid.innerHTML = keys.length ? keys.map(id => {
            const orderObj = ordersDB[id];
            const items = orderObj.items || [];
            const nSum = items.reduce((s, i) => s + i.nestingQty, 0);
            const sSum = items.reduce((s, i) => s + i.sawQty, 0);
            return `
                <div class="order-item" onclick="openOrder('${escapeHtml(id)}')">
                    <button class="order-del-top" onclick="deleteOrder(event, '${escapeHtml(id)}')">刪除</button>
                    <h3>${escapeHtml(id)}</h3>
                    <div class="order-meta">
                        案名：<strong>${escapeHtml(orderObj.projectName || '未填寫')}</strong><br>
                        出貨日：<strong>${escapeHtml(orderObj.shipDate || '未定')}</strong><br>
                        Nesting：<strong>${nSum}</strong> 片 ｜ 電子鋸：<strong>${sSum}</strong> 片
                    </div>
                </div>`;
        }).join('') : `<div style="color:#6b7280;grid-column:1/-1;text-align:center;padding:20px;">尚無訂單</div>`;
    }

    function renderDetailViews() {
        const orderObj = ordersDB[currentOrder] || { items: [] };
        const items = orderObj.items || [];
        
        const desktopBody = document.getElementById('detailTableBody');
        const mobileContainer = document.getElementById('mobileCardContainer');

        if (!items.length) {
            desktopBody.innerHTML = `<tr><td colspan="5" style="color:#9ca3af;padding:30px;">尚無色號資料</td></tr>`;
            mobileContainer.innerHTML = `<div style="text-align:center;color:#9ca3af;padding:30px;background:#fff;border-radius:8px;">尚無色號資料</div>`;
            return;
        }

        let nTotal = 0, sTotal = 0;

        desktopBody.innerHTML = items.map((i, idx) => {
            nTotal += i.nestingQty; sTotal += i.sawQty;
            const lbl = `<span class="merged-text">${escapeHtml(i.colorCode)}</span><span class="merged-sub">${escapeHtml(i.woodName)}</span>`;
            return `<tr>
                <td class="cell-n">${i.nestingQty > 0 ? lbl : ''}</td>
                <td class="cell-n divider qty-bold">${i.nestingQty > 0 ? i.nestingQty : ''}</td>
                <td class="cell-s">${i.sawQty > 0 ? lbl : ''}</td>
                <td class="cell-s qty-bold">${i.sawQty > 0 ? i.sawQty : ''}</td>
                <td><button class="btn-del" onclick="deleteColorRow(${idx})">刪除</button></td>
            </tr>`;
        }).join('') + `<tr class="sum-row"><td style="text-align:right;">Nesting 合計：</td><td class="divider" style="color:#1e40af;font-size:17px;">${nTotal} 片</td><td style="text-align:right;">電子鋸 合計：</td><td style="color:#b45309;font-size:17px;">${sTotal} 片</td><td></td></tr>`;

        mobileContainer.innerHTML = items.map((i, idx) => {
            return `
                <div class="mobile-card-item">
                    <div class="mobile-card-header">
                        <span>${escapeHtml(i.colorCode)} <small style="color:#475569;font-weight:normal;">(${escapeHtml(i.woodName)})</small></span>
                        <button class="btn-del" onclick="deleteColorRow(${idx})">刪除</button>
                    </div>
                    <div class="mobile-sub-section" style="background:#eff6ff;">
                        <span style="color:#1e40af;font-weight:bold;">Nesting 加工</span>
                        <span class="qty-bold" style="color:#1e40af;">${i.nestingQty > 0 ? i.nestingQty + ' 片' : '無'}</span>
                    </div>
                    <div class="mobile-sub-section" style="background:#fffbeb;">
                        <span style="color:#92400e;font-weight:bold;">電子鋸 加工</span>
                        <span class="qty-bold" style="color:#b45309;">${i.sawQty > 0 ? i.sawQty + ' 片' : '無'}</span>
                    </div>
                </div>`;
        }).join('') + `
            <div class="mobile-sum-box">
                <div>Nesting 總計<br><span style="color:#1e40af;font-size:18px;">${nTotal} 片</span></div>
                <div style="border-left:1px solid #cbd5e1;padding-left:15px;">電子鋸 總計<br><span style="color:#b45309;font-size:18px;">${sTotal} 片</span></div>
            </div>`;
    }

    function exportSingleCSV() {
        const orderObj = ordersDB[currentOrder] || { items: [] };
        const items = orderObj.items || [];
        if (!items.length) return alert('無資料可匯出');
        let csv = `\uFEFF訂單號,案名,出貨日期,Nesting(色號/木名),Nesting數量,電子鋸(色號/木名),電子鋸數量\n`;
        items.forEach(i => {
            const nStr = i.nestingQty > 0 ? `${i.colorCode} ${i.woodName}` : '';
            const sStr = i.sawQty > 0 ? `${i.colorCode} ${i.woodName}` : '';
            csv += `"${currentOrder}","${orderObj.projectName || ''}","${orderObj.shipDate || ''}","${nStr}",${i.nestingQty || ''},"${sStr}",${i.sawQty || ''}\n`;
        });
        downloadCSV(csv, `訂單_${currentOrder}.csv`);
    }

    function exportAllCSV() {
        const keys = Object.keys(ordersDB);
        if (!keys.length) return alert('無資料可匯出');
        let csv = `\uFEFF訂單號,案名,出貨日期,Nesting(色號/木名),Nesting數量,電子鋸(色號/木名),電子鋸數量\n`;
        keys.forEach(id => {
            const orderObj = ordersDB[id];
            (orderObj.items || []).forEach(i => {
                const nStr = i.nestingQty > 0 ? `${i.colorCode} ${i.woodName}` : '';
                const sStr = i.sawQty > 0 ? `${i.colorCode} ${i.woodName}` : '';
                csv += `"${id}","${orderObj.projectName || ''}","${orderObj.shipDate || ''}","${nStr}",${i.nestingQty || ''},"${sStr}",${i.sawQty || ''}\n`;
            });
        });
        downloadCSV(csv, `全部訂單分板總表.csv`);
    }

    function downloadCSV(csv, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
        a.download = name; 
        a.click();
    }
</script>
</body>
</html>
